<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 10.2 — A minimal roster: producer, independent reviewer, gates, human decision</title>
  <desc>An architecture diagram read left to right. A thin orchestrator bar spans the top. Below, a specification feeds a producer agent with tools and a data store; its output passes a deterministic gate labelled tests, schema, citations, units; then an independent reviewer agent, annotated different model, narrowed context and adversarial brief; then a second gate; then a human decision point annotated that accountability, interpretation and authorship stay there. A single fail arrow returns from reviewer to producer, labelled bounded iterations then escalate.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="ahO" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#E69F00"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- orchestrator bar (grey) -->
  <rect x="40" y="66" width="1200" height="46" rx="8" fill="none" stroke="#999999" stroke-width="2.5"/>
  <text x="640" y="95" font-size="17" fill="#999999" text-anchor="middle">orchestrator — sequences, enforces stop conditions</text>

  <!-- specification tag (blue) -->
  <rect x="52" y="300" width="132" height="56" rx="8" fill="#0072B2"/>
  <text x="118" y="334" font-size="15" fill="#FFFFFF" text-anchor="middle">specification</text>

  <!-- producer agent (orange) with tools + data store -->
  <rect x="240" y="238" width="210" height="180" rx="14" fill="none" stroke="#E69F00" stroke-width="3"/>
  <path d="M330,268 A15,15 0 1 1 316,261" fill="none" stroke="#E69F00" stroke-width="2.5" marker-end="url(#ahO)"/>
  <text x="345" y="278" font-size="16" fill="#E69F00" text-anchor="middle">producer agent</text>
  <!-- tools (green wrench) -->
  <g stroke="#009E73" stroke-width="8" fill="none" stroke-linecap="round" transform="translate(300,350)">
    <path d="M11,-11 A16,16 0 1 0 11,11"/>
    <path d="M-12,12 L-30,30"/>
  </g>
  <text x="292" y="400" font-size="14" fill="#111111" text-anchor="middle">tools</text>
  <!-- data store (sky cylinder) -->
  <path d="M378,332 v38 a30,8 0 0 0 60,0 v-38" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="408" cy="332" rx="30" ry="8" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="408" y="400" font-size="14" fill="#111111" text-anchor="middle">data store</text>

  <!-- gate 1 (vermillion) -->
  <polygon points="565,254 645,328 565,402 485,328" fill="#D55E00"/>
  <text x="565" y="318" font-size="13" fill="#FFFFFF" text-anchor="middle">tests · schema</text>
  <text x="565" y="338" font-size="13" fill="#FFFFFF" text-anchor="middle">citations · units</text>

  <!-- independent reviewer (purple) -->
  <rect x="700" y="252" width="200" height="152" rx="14" fill="none" stroke="#CC79A7" stroke-width="3"/>
  <circle cx="760" cy="292" r="14" fill="none" stroke="#CC79A7" stroke-width="3"/>
  <path d="M737,330 a23,23 0 0 1 46,0" fill="none" stroke="#CC79A7" stroke-width="3"/>
  <path d="M792,296 l7,7 l14,-16" fill="none" stroke="#CC79A7" stroke-width="3"/>
  <text x="800" y="292" font-size="15" fill="#111111" text-anchor="middle">independent</text>
  <text x="800" y="312" font-size="15" fill="#111111" text-anchor="middle">reviewer</text>
  <text x="800" y="360" font-size="12" fill="#111111" text-anchor="middle">different model ·</text>
  <text x="800" y="377" font-size="12" fill="#111111" text-anchor="middle">narrowed context ·</text>
  <text x="800" y="394" font-size="12" fill="#111111" text-anchor="middle">adversarial brief</text>

  <!-- gate 2 (vermillion) -->
  <polygon points="985,278 1043,328 985,378 927,328" fill="#D55E00"/>
  <text x="985" y="333" font-size="15" fill="#FFFFFF" text-anchor="middle">gate</text>

  <!-- human decision (blue) -->
  <circle cx="1160" cy="300" r="16" fill="none" stroke="#0072B2" stroke-width="3"/>
  <path d="M1132,352 a28,28 0 0 1 56,0" fill="none" stroke="#0072B2" stroke-width="3"/>
  <text x="1160" y="384" font-size="16" fill="#0072B2" text-anchor="middle">human decision</text>

  <!-- main flow arrows -->
  <line x1="184" y1="328" x2="238" y2="328" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="450" y1="328" x2="483" y2="328" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="645" y1="328" x2="698" y2="328" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="900" y1="328" x2="925" y2="328" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="1043" y1="328" x2="1122" y2="328" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- fail return arrow reviewer -> producer -->
  <path d="M800,404 L800,470 L345,470 L345,420" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="572" y="492" font-size="15" fill="#111111" text-anchor="middle">fail — bounded iterations, then escalate</text>

  <!-- callouts -->
  <text x="800" y="230" font-size="14" fill="#CC79A7" text-anchor="middle">independence engineered here</text>
  <line x1="800" y1="236" x2="800" y2="250" stroke="#CC79A7" stroke-width="1.5"/>

  <text x="1160" y="420" font-size="13" fill="#0072B2" text-anchor="middle">accountability, interpretation,</text>
  <text x="1160" y="438" font-size="13" fill="#0072B2" text-anchor="middle">authorship stay here</text>
</svg>
