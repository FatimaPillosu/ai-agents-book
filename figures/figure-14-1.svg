<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 14.1 — Three tiers inside one trust boundary</title>
  <desc>An architecture diagram dominated by a large box labelled partner environment, the trust boundary. Inside it, an observations cylinder feeds a deterministic verification core that produces scores, which a human review diamond inspects. A dashed optional box labelled local tutoring tier connects to the core's outputs to explain and guide but is tagged no decision. Only one arrow leaves the boundary, from human review to an external team icon, labelled aggregate scores and questions only; the observations never cross.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="ahS" markerWidth="12" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M12,0 L0,5 L12,10 Z" fill="#111111"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- trust boundary -->
  <rect x="40" y="95" width="945" height="560" rx="16" fill="none" stroke="#999999" stroke-width="3"/>
  <text x="66" y="132" font-size="20" fill="#111111">partner environment (trust boundary)</text>

  <!-- observations cylinder (data store, sky) -->
  <path d="M94,328 v112 a56,15 0 0 0 112,0 v-112" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="150" cy="328" rx="56" ry="15" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="150" y="472" font-size="16" fill="#111111" text-anchor="middle">observations</text>
  <text x="150" y="492" font-size="16" fill="#111111" text-anchor="middle">(never leave)</text>

  <!-- observations to core -->
  <line x1="210" y1="388" x2="326" y2="388" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- deterministic verification core (tool green) -->
  <rect x="330" y="325" width="220" height="132" rx="10" fill="none" stroke="#009E73" stroke-width="3"/>
  <text x="440" y="358" font-size="17" fill="#111111" text-anchor="middle">deterministic</text>
  <text x="440" y="380" font-size="17" fill="#111111" text-anchor="middle">verification core</text>
  <rect x="385" y="398" width="110" height="34" rx="6" fill="#56B4E9"/>
  <text x="440" y="421" font-size="16" fill="#111111" text-anchor="middle">scores</text>

  <!-- core to human review -->
  <line x1="552" y1="390" x2="636" y2="390" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- human review gate (vermillion) -->
  <polygon points="730,328 822,390 730,452 638,390" fill="#D55E00"/>
  <text x="730" y="384" font-size="16" fill="#FFFFFF" text-anchor="middle">human</text>
  <text x="730" y="404" font-size="16" fill="#FFFFFF" text-anchor="middle">review</text>

  <!-- local tutoring tier (agent orange, dashed = optional) -->
  <rect x="575" y="140" width="330" height="112" rx="10" fill="none" stroke="#E69F00" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="722" y="182" font-size="17" fill="#E69F00" text-anchor="middle">local tutoring tier —</text>
  <text x="722" y="204" font-size="17" fill="#E69F00" text-anchor="middle">open-weight model</text>
  <rect x="815" y="150" width="80" height="28" rx="8" fill="#E69F00"/>
  <text x="855" y="169" font-size="14" fill="#111111" text-anchor="middle">optional</text>
  <rect x="600" y="212" width="130" height="30" rx="15" fill="#999999"/>
  <text x="665" y="232" font-size="14" fill="#FFFFFF" text-anchor="middle">no decision</text>

  <!-- explains / guides two-way dashed link tutoring <-> core -->
  <line x1="700" y1="254" x2="472" y2="323" stroke="#111111" stroke-width="2" stroke-dasharray="7 5" marker-start="url(#ahS)" marker-end="url(#ah)"/>
  <text x="512" y="300" font-size="15" fill="#111111" text-anchor="middle">explains / guides</text>

  <!-- degrades annotation -->
  <text x="868" y="282" font-size="13" fill="#999999" text-anchor="middle">degrades to nothing if</text>
  <text x="868" y="298" font-size="13" fill="#999999" text-anchor="middle">compute unavailable</text>

  <!-- human review to external team, crossing the boundary -->
  <line x1="824" y1="390" x2="1058" y2="390" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="940" y="356" font-size="14" fill="#111111" text-anchor="middle">aggregate scores +</text>
  <text x="940" y="374" font-size="14" fill="#111111" text-anchor="middle">questions only</text>

  <!-- team (escalation) icon (human blue), outside boundary -->
  <circle cx="1095" cy="372" r="15" fill="none" stroke="#0072B2" stroke-width="3"/>
  <path d="M1069,422 a26,26 0 0 1 52,0" fill="none" stroke="#0072B2" stroke-width="3"/>
  <text x="1095" y="452" font-size="16" fill="#111111" text-anchor="middle">team</text>
  <text x="1095" y="472" font-size="16" fill="#111111" text-anchor="middle">(escalation)</text>

  <!-- boundary annotation bracket -->
  <path d="M120,590 v14 h740 v-14" fill="none" stroke="#999999" stroke-width="1.5"/>
  <line x1="490" y1="604" x2="490" y2="618" stroke="#999999" stroke-width="1.5"/>
  <text x="490" y="640" font-size="15" fill="#111111" text-anchor="middle">no observational data egress</text>
</svg>
