<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><marker id="ah62" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs>
<rect width="1600" height="900" fill="#F7F7F5"/>
<text x="56.0" y="72.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" fill="#111111" font-weight="600" text-anchor="start">Ingest, propose, dispose, record</text>
<text x="56.0" y="112.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#3A3A3A" font-weight="400" text-anchor="start">Everything left of the red line is a request; everything right of it is a decision.</text>
<rect x="234.5" y="200.0" width="36.0" height="36.0" rx="6" fill="none" stroke="#E69F00" stroke-width="2.3"/>
<path d="M245.3,219.8 a7.56,7.56 0 1 1 8.64,6.12" fill="none" stroke="#E69F00" stroke-width="2"/>
<text x="252.5" y="269.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">ingest and normalise</text>
<rect x="599.5" y="200.0" width="36.0" height="36.0" rx="6" fill="none" stroke="#E69F00" stroke-width="2.3"/>
<path d="M610.3,219.8 a7.56,7.56 0 1 1 8.64,6.12" fill="none" stroke="#E69F00" stroke-width="2"/>
<text x="617.5" y="269.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">propose flags</text>
<polygon points="982.5,172.0 1127.5,226 982.5,280.0 837.5,226" fill="none" stroke="#D55E00" stroke-width="2.4"/>
<text x="982.5" y="232.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">dispose</text>
<path d="M1202.5,199.36 a145.0,10.360000000000001 0 0 1 290,0 v53.28 a145.0,10.360000000000001 0 0 1 -290,0 z" fill="none" stroke="#56B4E9" stroke-width="2.2"/>
<path d="M1202.5,199.36 a145.0,10.360000000000001 0 0 0 290,0" fill="none" stroke="#56B4E9" stroke-width="2.2"/>
<text x="1347.5" y="231.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">record provenance</text>
<line x1="200.5" y1="330.0" x2="304.5" y2="330.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah62)"/>
<text x="252.5" y="314.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">1 raw series in</text>
<text x="252.5" y="354.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">different formats, one tidy representation</text>
<line x1="200.5" y1="402.0" x2="304.5" y2="402.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah62)"/>
<text x="252.5" y="386.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">2 normalise units + UTC</text>
<text x="252.5" y="426.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">an unresolved unit halts the pipeline rather than defaulting</text>
<line x1="286.5" y1="474.0" x2="583.5" y2="474.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah62)"/>
<text x="435.0" y="458.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">3 propose flags + justification</text>
<text x="435.0" y="498.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">each proposal carries its evidence and the neighbouring context weighed</text>
<line x1="1016.5" y1="546.0" x2="1313.5" y2="546.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah62)"/>
<text x="1165.0" y="530.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">4 physical bounds + inter-station</text>
<text x="1165.0" y="570.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">the rules can reject a proposal the agent was confident about</text>
<line x1="1016.5" y1="618.0" x2="1313.5" y2="618.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah62)"/>
<text x="1165.0" y="602.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">5 apply flag / reject</text>
<text x="1165.0" y="642.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">a rejection is logged, and the observation stands as measured</text>
<line x1="1016.5" y1="690.0" x2="1313.5" y2="690.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah62)"/>
<text x="1165.0" y="674.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">6 write provenance</text>
<text x="1165.0" y="714.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">keyed to the inputs and the rule-set version, so the record can be reconstructed</text>
<line x1="800.0" y1="300.0" x2="800.0" y2="724.0" stroke="#D55E00" stroke-width="3"/>
<text x="800.0" y="760.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#D55E00" font-weight="400" text-anchor="middle">authority boundary - agent proposes, rules dispose</text>
<text x="56.0" y="860.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#999999" font-weight="400" text-anchor="start">One observation, six steps: the pattern never lets the agent cross the line.</text>
</svg>
