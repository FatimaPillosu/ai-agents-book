<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 14.3 — From blocked egress to local verification and learning</title>
  <desc>Two stacked panels. The before panel shows an observations cylinder inside a trust boundary with a blocked, crossed-out arrow trying to reach off-site verification, tagged months of negotiation and often no agreement. The after panel shows the same observations and boundary now containing a deterministic core, an optional tutoring tier and a human review step, with a single arrow carrying aggregate scores only out to the team, and a note that users learn on their own data.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="ahGr" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- ===================== BEFORE ===================== -->
  <text x="64" y="56" font-size="20" font-weight="bold" fill="#111111">before</text>
  <rect x="64" y="70" width="740" height="248" rx="14" fill="none" stroke="#999999" stroke-width="3"/>
  <text x="88" y="98" font-size="16" fill="#999999">trust boundary</text>

  <!-- observations cylinder -->
  <path d="M138,158 v78 a52,14 0 0 0 104,0 v-78" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="190" cy="158" rx="52" ry="14" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="190" y="272" font-size="16" fill="#111111" text-anchor="middle">observations</text>

  <!-- blocked egress arrow -->
  <line x1="250" y1="188" x2="968" y2="188" stroke="#999999" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#ahGr)"/>
  <text x="828" y="150" font-size="15" fill="#D55E00" text-anchor="middle">blocked</text>
  <line x1="814" y1="174" x2="842" y2="202" stroke="#D55E00" stroke-width="4"/>
  <line x1="842" y1="174" x2="814" y2="202" stroke="#D55E00" stroke-width="4"/>
  <text x="900" y="248" font-size="14" fill="#999999" text-anchor="middle">months of negotiation /</text>
  <text x="900" y="268" font-size="14" fill="#999999" text-anchor="middle">often no agreement</text>

  <!-- off-site verification box -->
  <rect x="975" y="150" width="235" height="76" rx="8" fill="none" stroke="#999999" stroke-width="2"/>
  <text x="1092" y="182" font-size="16" fill="#111111" text-anchor="middle">verification,</text>
  <text x="1092" y="204" font-size="16" fill="#111111" text-anchor="middle">off-site</text>

  <!-- ===================== AFTER ===================== -->
  <text x="64" y="372" font-size="20" font-weight="bold" fill="#111111">after</text>
  <rect x="64" y="386" width="880" height="286" rx="14" fill="none" stroke="#999999" stroke-width="3"/>
  <text x="88" y="414" font-size="16" fill="#999999">trust boundary</text>

  <!-- observations cylinder -->
  <path d="M125,478 v70 a50,13 0 0 0 100,0 v-70" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="175" cy="478" rx="50" ry="13" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="175" y="586" font-size="16" fill="#111111" text-anchor="middle">observations</text>

  <!-- observations to core -->
  <line x1="228" y1="500" x2="298" y2="500" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- deterministic core (green) -->
  <rect x="300" y="460" width="200" height="80" rx="10" fill="none" stroke="#009E73" stroke-width="3"/>
  <text x="400" y="505" font-size="15" fill="#111111" text-anchor="middle">deterministic core</text>

  <!-- tutoring tier (orange dashed) -->
  <rect x="300" y="556" width="230" height="52" rx="10" fill="none" stroke="#E69F00" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="415" y="588" font-size="14" fill="#E69F00" text-anchor="middle">tutoring tier (optional)</text>
  <line x1="400" y1="540" x2="400" y2="554" stroke="#111111" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- core to human review -->
  <line x1="502" y1="500" x2="576" y2="500" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- human review diamond (vermillion) -->
  <polygon points="650,452 720,502 650,552 580,502" fill="#D55E00"/>
  <text x="650" y="498" font-size="14" fill="#FFFFFF" text-anchor="middle">human</text>
  <text x="650" y="516" font-size="14" fill="#FFFFFF" text-anchor="middle">review</text>

  <!-- aggregate scores only, crossing boundary -->
  <line x1="722" y1="502" x2="1018" y2="502" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="850" y="486" font-size="14" fill="#111111" text-anchor="middle">aggregate scores only</text>

  <!-- team icon (blue) outside boundary -->
  <circle cx="1080" cy="484" r="14" fill="none" stroke="#0072B2" stroke-width="3"/>
  <path d="M1056,530 a24,24 0 0 1 48,0" fill="none" stroke="#0072B2" stroke-width="3"/>
  <text x="1080" y="562" font-size="16" fill="#111111" text-anchor="middle">team</text>

  <!-- users learn on own data tag -->
  <rect x="330" y="622" width="240" height="30" rx="15" fill="#56B4E9"/>
  <text x="450" y="642" font-size="14" fill="#111111" text-anchor="middle">users learn on own data</text>

  <!-- after bracket -->
  <path d="M120,682 v8 h700 v-8" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="470" y="710" font-size="13" fill="#111111" text-anchor="middle">verification and teaching happen inside the boundary</text>
</svg>
