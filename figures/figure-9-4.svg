<text x="800.0" y="696.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">6 assemble reply - author reads in full</text>
<text x="800.0" y="736.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">the agent formats; the author reads it all before submission</text>
<text x="56.0" y="860.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#999999" font-weight="400" text-anchor="start">Steps 1, 2 and 6 are clerical and belong to the agent; step 3, in the blue band, is yours alone.</text>
