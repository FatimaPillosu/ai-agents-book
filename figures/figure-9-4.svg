<line x1="347.3" y1="406.4" x2="1252.7" y2="406.4" stroke="#111111" stroke-width="2.1" marker-end="url(#ah94)"/>
<text x="800.0" y="390.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">2 propose classification</text>
<text x="800.0" y="430.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">a proposal, not a decision</text>
