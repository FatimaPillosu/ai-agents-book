<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 9.4 — Clerical structuring, human judgement, clerical assembly</title>
  <desc>A top-to-bottom sequence diagram with three columns: an orange agent, a sky-blue pipeline, and a blue author. Steps one and two, bracketed as agent clerical work, have the agent parse the review into a comment table and propose a classification. A central blue band labelled human interpretive authority covers step three, where the author corrects the classification and decides each response, and step four, where a requested re-run regenerates a figure and table from the pipeline. Step five is a vermillion verification gate where the author checks the regenerated output against result files. Step six, again agent clerical work, assembles the reply, which the author reads in full before submission.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="ahV" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#D55E00"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- blue band: human interpretive authority (drawn first, behind) -->
  <rect x="40" y="312" width="1200" height="150" rx="8" fill="#0072B2" fill-opacity="0.12"/>
  <text x="1224" y="336" font-size="16" fill="#0072B2" text-anchor="end">human interpretive authority</text>

  <!-- lifelines -->
  <line x1="250" y1="118" x2="250" y2="650" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="640" y1="118" x2="640" y2="650" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="1030" y1="118" x2="1030" y2="650" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- actor headers -->
  <rect x="205" y="46" width="90" height="60" rx="12" fill="none" stroke="#E69F00" stroke-width="3"/>
  <path d="M275,72 A13,13 0 1 1 262,66" fill="none" stroke="#E69F00" stroke-width="2.5" marker-end="url(#ahOhdr)"/>
  <text x="250" y="128" font-size="17" fill="#111111" text-anchor="middle">agent</text>
  <defs>
    <marker id="ahOhdr" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#E69F00"/>
    </marker>
  </defs>

  <path d="M600,60 v40 a40,10 0 0 0 80,0 v-40" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="640" cy="60" rx="40" ry="10" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="640" y="128" font-size="17" fill="#111111" text-anchor="middle">pipeline</text>

  <circle cx="1030" cy="62" r="14" fill="none" stroke="#0072B2" stroke-width="3"/>
  <path d="M1007,106 a23,23 0 0 1 46,0" fill="none" stroke="#0072B2" stroke-width="3"/>
  <text x="1030" y="128" font-size="17" fill="#111111" text-anchor="middle">author</text>

  <!-- grey bracket: agent clerical (steps 1-2) -->
  <path d="M120,180 h-14 v96 h14" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text transform="translate(96,228) rotate(-90)" font-size="14" fill="#999999" text-anchor="middle">agent: clerical only</text>

  <!-- step 1: agent internal -->
  <rect x="140" y="182" width="220" height="36" rx="6" fill="none" stroke="#E69F00" stroke-width="2"/>
  <text x="250" y="205" font-size="15" fill="#111111" text-anchor="middle">1 parse review to comment table</text>

  <!-- step 2: agent internal -->
  <rect x="150" y="240" width="200" height="36" rx="6" fill="none" stroke="#E69F00" stroke-width="2"/>
  <text x="250" y="263" font-size="15" fill="#111111" text-anchor="middle">2 propose classification</text>

  <!-- step 3: author internal (in band) -->
  <rect x="920" y="330" width="220" height="36" rx="6" fill="none" stroke="#0072B2" stroke-width="2"/>
  <text x="1030" y="353" font-size="15" fill="#111111" text-anchor="middle">3 decide each response</text>

  <!-- step 4: regenerate from pipeline (agent <-> pipeline, in band) -->
  <text x="445" y="404" font-size="15" fill="#111111" text-anchor="middle">4 regenerate from pipeline</text>
  <line x1="250" y1="418" x2="638" y2="418" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="640" y1="444" x2="252" y2="444" stroke="#111111" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>

  <!-- step 5: verify against result files (author -> pipeline, vermillion) -->
  <polygon points="838,510 856,527 838,544 820,527" fill="#D55E00"/>
  <path d="M838,527 l-6,-6 l4,-4 l4,7 l9,-12 l4,3 z" fill="#FFFFFF"/>
  <line x1="1028" y1="527" x2="862" y2="527" stroke="#D55E00" stroke-width="2" marker-end="url(#ahV)"/>
  <line x1="818" y1="527" x2="662" y2="527" stroke="#D55E00" stroke-width="2" marker-end="url(#ahV)"/>
  <text x="640" y="505" font-size="15" fill="#D55E00" text-anchor="middle">5 verify against result files</text>
  <text x="960" y="505" font-size="14" fill="#D55E00" text-anchor="middle">verify before use</text>

  <!-- grey bracket: agent clerical (step 6) -->
  <path d="M120,584 h-14 v40 h14" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text transform="translate(96,604) rotate(-90)" font-size="14" fill="#999999" text-anchor="middle">agent: clerical only</text>

  <!-- step 6: agent internal -->
  <rect x="130" y="586" width="360" height="38" rx="6" fill="none" stroke="#E69F00" stroke-width="2"/>
  <text x="310" y="610" font-size="15" fill="#111111" text-anchor="middle">6 assemble reply · author reads in full</text>
</svg>
