<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 2.1 — The plan–act–observe control cycle</title>
  <desc>A circular diagram of three nodes (plan, act and observe) read clockwise. A goal enters at plan; observe writes to a state-and-memory cylinder beneath the ring and returns to plan. A branch from plan reaches a stop-condition diamond whose done exit produces a result artefact and whose continue exit re-enters the ring. A callout on the observe step notes that the returned result is external, not the model's self-assessment.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="ahO" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#E69F00"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- specification / goal tag (blue) -->
  <rect x="60" y="173" width="170" height="58" rx="8" fill="#0072B2"/>
  <text x="145" y="199" font-size="17" fill="#FFFFFF" text-anchor="middle">specification</text>
  <text x="145" y="220" font-size="17" fill="#FFFFFF" text-anchor="middle">/ goal</text>
  <line x1="230" y1="202" x2="455" y2="201" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ring: plan (orange) -->
  <rect x="460" y="165" width="120" height="72" rx="14" fill="none" stroke="#E69F00" stroke-width="3"/>
  <path d="M498,208 A12,12 0 1 1 490,190" fill="none" stroke="#E69F00" stroke-width="2.5" marker-end="url(#ahO)"/>
  <text x="535" y="208" font-size="20" fill="#111111" text-anchor="middle">plan</text>

  <!-- ring: act (green) -->
  <rect x="592" y="372" width="120" height="66" rx="14" fill="none" stroke="#009E73" stroke-width="3"/>
  <g stroke="#009E73" stroke-width="8" fill="none" stroke-linecap="round" transform="translate(628,405)">
    <path d="M8,-8 A13,13 0 1 0 8,8"/>
    <path d="M-8,8 L-22,22"/>
  </g>
  <text x="675" y="412" font-size="20" fill="#111111" text-anchor="middle">act</text>

  <!-- ring: observe (near-black) -->
  <rect x="328" y="372" width="120" height="66" rx="14" fill="none" stroke="#111111" stroke-width="3"/>
  <text x="388" y="412" font-size="20" fill="#111111" text-anchor="middle">observe</text>

  <!-- ring arrows -->
  <path d="M572,238 C616,300 632,344 648,370" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="590" y1="405" x2="452" y2="405" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M388,440 C420,482 450,496 481,506" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- state / memory cylinder (sky) -->
  <path d="M472,512 v56 a48,12 0 0 0 96,0 v-56" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="520" cy="512" rx="48" ry="12" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="520" y="608" font-size="17" fill="#111111" text-anchor="middle">state / memory</text>

  <!-- state returns to plan -->
  <line x1="520" y1="500" x2="520" y2="240" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- plan branch to stop condition -->
  <line x1="580" y1="201" x2="794" y2="201" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- stop condition diamond (vermillion) -->
  <polygon points="840,159 882,201 840,243 798,201" fill="#D55E00"/>
  <text x="840" y="197" font-size="14" fill="#FFFFFF" text-anchor="middle">stop</text>
  <text x="840" y="214" font-size="14" fill="#FFFFFF" text-anchor="middle">condition</text>

  <!-- done exit to result -->
  <line x1="882" y1="201" x2="1026" y2="201" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="955" y="190" font-size="16" fill="#111111" text-anchor="middle">done</text>
  <rect x="1030" y="170" width="120" height="64" rx="8" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="1090" y="208" font-size="18" fill="#111111" text-anchor="middle">result</text>

  <!-- continue exit re-enters the ring -->
  <path d="M840,243 L840,300 L560,300 L560,240" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="700" y="292" font-size="16" fill="#111111" text-anchor="middle">continue</text>

  <!-- annotation on observe to state -->
  <line x1="300" y1="500" x2="430" y2="492" stroke="#999999" stroke-width="1.5"/>
  <text x="240" y="494" font-size="15" fill="#111111" text-anchor="middle">external result,</text>
  <text x="240" y="514" font-size="15" fill="#111111" text-anchor="middle">not self-assessment</text>
</svg>
