<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><marker id="ah21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs>
<rect width="1600" height="900" fill="#F7F7F5"/>
<text x="56.0" y="72.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" fill="#111111" font-weight="600" text-anchor="start">The plan-act-observe loop</text>
<text x="56.0" y="112.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#3A3A3A" font-weight="400" text-anchor="start">The loop corrects only the errors its observe step can actually see.</text>
<rect x="560.0" y="236.0" width="200.0" height="80.0" rx="10" fill="none" stroke="#E69F00" stroke-width="2.2"/>
<text x="660.0" y="282.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">plan</text>
<rect x="920.0" y="436.0" width="200.0" height="80.0" rx="10" fill="none" stroke="#009E73" stroke-width="2.2"/>
<text x="1020.0" y="482.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">act</text>
<rect x="200.0" y="436.0" width="200.0" height="80.0" rx="10" fill="none" stroke="#111111" stroke-width="2.2"/>
<text x="300.0" y="482.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">observe</text>
<path d="M760.0,276.0 L1020.0,276.0 L1020.0,390.0" fill="none" stroke="#111111" stroke-width="2.1" marker-end="url(#ah21)"/>
<line x1="914.0" y1="476.0" x2="306.0" y2="476.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah21)"/>
<path d="M300.0,430.0 L300.0,300.0 L554.0,300.0" fill="none" stroke="#111111" stroke-width="2.1" marker-end="url(#ah21)"/>
<text x="492.0" y="352.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">the model proposes one</text>
<text x="492.0" y="370.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">action</text>
<text x="852.0" y="552.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">machinery outside the</text>
<text x="852.0" y="570.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">model carries it out</text>
<text x="56.0" y="552.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">the result comes</text>
<text x="56.0" y="570.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">back, whether it</text>
<text x="56.0" y="589.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">is an answer or</text>
<text x="56.0" y="608.3" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">an error</text>
<rect x="96.0" y="236.0" width="150.0" height="70.0" rx="18" fill="none" stroke="#0072B2" stroke-width="2.2"/>
<text x="171.0" y="277.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">goal</text>
<line x1="246.0" y1="271.0" x2="554.0" y2="271.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah21)"/>
<text x="400.0" y="251.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">written before the loop starts</text>
<path d="M530,652.04 a95.0,12.040000000000001 0 0 1 190,0 v61.92 a95.0,12.040000000000001 0 0 1 -190,0 z" fill="none" stroke="#56B4E9" stroke-width="2.2"/>
<path d="M530,652.04 a95.0,12.040000000000001 0 0 0 190,0" fill="none" stroke="#56B4E9" stroke-width="2.2"/>
<text x="625.0" y="689.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">state / memory</text>
<path d="M236.0,516.0 L236.0,600.0 L430.0,600.0 L430.0,656.0" fill="none" stroke="#56B4E9" stroke-width="2.1" marker-end="url(#ah21)"/>
<text x="340.0" y="586.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">what the next step gets to see</text>
<path d="M625.0,636.0 L625.0,600.0 L716.0,600.0 L716.0,318.0" fill="none" stroke="#56B4E9" stroke-width="2.1" marker-end="url(#ah21)"/>
<polygon points="1210,214.0 1305.0,256 1210,298.0 1115.0,256" fill="none" stroke="#D55E00" stroke-width="2.4"/>
<text x="1210.0" y="262.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">stop condition</text>
<line x1="766.0" y1="256.0" x2="1109.0" y2="256.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah21)"/>
<text x="940.0" y="238.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">check after each plan</text>
<text x="1130.0" y="360.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">succeed and halt, or</text>
<text x="1130.0" y="378.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">fail and hand back</text>
<line x1="1305.0" y1="256.0" x2="1400.0" y2="256.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah21)"/>
<text x="1352.0" y="240.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">done</text>
<rect x="1400.0" y="221.0" width="140.0" height="70.0" rx="10" fill="none" stroke="#56B4E9" stroke-width="2.2"/>
<text x="1470.0" y="262.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">result</text>
<rect x="1040.0" y="560.0" width="420.0" height="76.3" rx="8" fill="#F0E442" stroke="none"/>
<text x="1052.0" y="584.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="400" text-anchor="start">a loop corrects only what this step can</text>
<text x="1052.0" y="603.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="400" text-anchor="start">see - a silent wrong answer is invisible</text>
<text x="1052.0" y="622.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="400" text-anchor="start">here</text>
<text x="56.0" y="860.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#999999" font-weight="400" text-anchor="start">The cycle, not any single response, is the engine: plan, act, observe, and repeat until the stop condition ends it.</text>
</svg>
