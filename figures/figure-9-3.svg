<defs><marker id="ah93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs>
<rect width="1600" height="900" fill="#F7F7F5"/>
<text x="56.0" y="72.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" fill="#111111" font-weight="600" text-anchor="start">Deciding what to disclose, and whether a use is permitted at all</text>
<text x="56.0" y="112.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#3A3A3A" font-weight="400" text-anchor="start">Answer these from your record, not from memory.</text>
<rect x="280.0" y="182.0" width="380.0" height="58.0" rx="10" fill="none" stroke="#E69F00" stroke-width="2.2"/>
<text x="470.0" y="205.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">agent used in preparing this</text>
<text x="470.0" y="229.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">output</text>
<line x1="470.0" y1="240.0" x2="470.0" y2="272.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah93)"/>
<polygon points="470,292.0 635.0,338 470,384.0 305.0,338" fill="none" stroke="#D55E00" stroke-width="2.4"/>
<text x="470.0" y="332.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">does the venue bar</text>
<text x="470.0" y="356.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">this task?</text>
<text x="56.0" y="300.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">some venues forbid</text>
<text x="56.0" y="318.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">agent-generated</text>
<text x="56.0" y="337.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">figures, data or</text>
<text x="56.0" y="356.3" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">citations outright</text>
<line x1="639.0" y1="338.0" x2="1010.0" y2="338.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah93)"/>
<text x="820.0" y="322.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">yes</text>
<rect x="1020.0" y="304.0" width="300.0" height="68.0" rx="10" fill="none" stroke="#D55E00" stroke-width="2.2"/>
<text x="1170.0" y="332.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">do not use; find a</text>
<text x="1170.0" y="356.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">permitted alternative</text>
<line x1="470.0" y1="386.0" x2="470.0" y2="428.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah93)"/>
<text x="444.0" y="414.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="end">no</text>
<polygon points="470,452.0 635.0,498 470,544.0 305.0,498" fill="none" stroke="#D55E00" stroke-width="2.4"/>
<text x="470.0" y="480.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">confidential</text>
<text x="470.0" y="504.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">manuscript under</text>
<text x="470.0" y="528.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">review?</text>
<rect x="56.0" y="457.4" width="3.4" height="56.3" fill="#D55E00"/>
<text x="68.0" y="470.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#D55E00" font-weight="400" text-anchor="start">once material is sent,</text>
<text x="68.0" y="488.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#D55E00" font-weight="400" text-anchor="start">its onward path is</text>
<text x="68.0" y="507.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#D55E00" font-weight="400" text-anchor="start">beyond your control</text>
<line x1="639.0" y1="498.0" x2="1010.0" y2="498.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah93)"/>
<text x="820.0" y="482.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">yes</text>
<rect x="1020.0" y="464.0" width="300.0" height="68.0" rx="10" fill="none" stroke="#D55E00" stroke-width="2.2"/>
<text x="1170.0" y="492.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">keep off external</text>
<text x="1170.0" y="516.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">systems</text>
<line x1="470.0" y1="546.0" x2="470.0" y2="588.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah93)"/>
<text x="444.0" y="574.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="end">no</text>
<polygon points="470,610.0 635.0,656 470,702.0 305.0,656" fill="none" stroke="#D55E00" stroke-width="2.4"/>
<text x="470.0" y="650.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">disclosure required or</text>
<text x="470.0" y="674.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">best practice?</text>
<text x="56.0" y="650.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="start">when in doubt, disclose</text>
<line x1="639.0" y1="656.0" x2="860.0" y2="656.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah93)"/>
<rect x="870.0" y="600.0" width="330.0" height="64.0" rx="10" fill="none" stroke="#009E73" stroke-width="2.2"/>
<text x="1035.0" y="626.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">generate disclosure from</text>
<text x="1035.0" y="650.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">provenance records</text>
<text x="870.0" y="692.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">assembled to whatever granularity the</text>
<text x="870.0" y="710.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">venue asks for, because the record</text>
<text x="870.0" y="729.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">already exists</text>
<line x1="1200.0" y1="632.0" x2="1270.0" y2="632.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah93)"/>
<circle cx="1330" cy="608.4" r="9.6" fill="none" stroke="#0072B2" stroke-width="2.3"/>
<path d="M1314,633.2 a16,14.4 0 0 1 32,0" fill="none" stroke="#0072B2" stroke-width="2.3"/>
<text x="1330.0" y="678.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="400" text-anchor="middle">author confirms</text>
<text x="56.0" y="860.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#999999" font-weight="400" text-anchor="start">No agent is ever listed or implied as an author - that class of rule is stable where the others move.</text>
