<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 10.4 — Deriving a roster from the specification schema</title>
  <desc>A top-to-bottom sequence with four numbered mappings. On the left, four specification fields as blue tags: objective, inputs, acceptance criteria, stop conditions. Each maps by a numbered arrow to a roster element on the right: objective to producer roles; inputs to tool and data access under least privilege; acceptance criteria to deterministic gates plus an independent reviewer brief, split by whether a rule can check the criterion; stop conditions to the orchestrator loop bound and escalation to a human.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="ahO" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#E69F00"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- column headers -->
  <text x="230" y="60" font-size="16" fill="#999999" text-anchor="middle">specification fields</text>
  <text x="920" y="60" font-size="16" fill="#999999" text-anchor="middle">roster elements</text>

  <!-- ===== Row 1: objective -> producer role(s) ===== -->
  <rect x="120" y="112" width="220" height="56" rx="8" fill="#0072B2"/>
  <text x="230" y="146" font-size="16" fill="#FFFFFF" text-anchor="middle">objective</text>
  <line x1="340" y1="140" x2="518" y2="140" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="429" cy="140" r="17" fill="#F7F7F5" stroke="#111111" stroke-width="2"/>
  <text x="429" y="146" font-size="16" fill="#111111" text-anchor="middle">1</text>
  <rect x="760" y="106" width="230" height="68" rx="12" fill="none" stroke="#E69F00" stroke-width="3"/>
  <path d="M800,134 A13,13 0 1 1 787,127" fill="none" stroke="#E69F00" stroke-width="2.5" marker-end="url(#ahO)"/>
  <text x="890" y="146" font-size="16" fill="#111111" text-anchor="middle">producer role(s)</text>

  <!-- ===== Row 2: inputs -> tool & data access ===== -->
  <rect x="120" y="262" width="220" height="56" rx="8" fill="#0072B2"/>
  <text x="230" y="296" font-size="16" fill="#FFFFFF" text-anchor="middle">inputs</text>
  <line x1="340" y1="290" x2="518" y2="290" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="429" cy="290" r="17" fill="#F7F7F5" stroke="#111111" stroke-width="2"/>
  <text x="429" y="296" font-size="16" fill="#111111" text-anchor="middle">2</text>
  <g stroke="#009E73" stroke-width="8" fill="none" stroke-linecap="round" transform="translate(792,290)">
    <path d="M11,-11 A16,16 0 1 0 11,11"/>
    <path d="M-12,12 L-28,28"/>
  </g>
  <path d="M840,274 v34 a26,7 0 0 0 52,0 v-34" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="866" cy="274" rx="26" ry="7" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="1010" y="286" font-size="15" fill="#111111" text-anchor="middle">tool &amp; data access</text>
  <text x="1010" y="306" font-size="15" fill="#111111" text-anchor="middle">(least privilege)</text>

  <!-- ===== Row 3: acceptance criteria -> gates + reviewer brief ===== -->
  <rect x="120" y="412" width="220" height="56" rx="8" fill="#0072B2"/>
  <text x="230" y="446" font-size="15" fill="#FFFFFF" text-anchor="middle">acceptance criteria</text>
  <line x1="340" y1="440" x2="518" y2="440" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="429" cy="440" r="17" fill="#F7F7F5" stroke="#111111" stroke-width="2"/>
  <text x="429" y="446" font-size="16" fill="#111111" text-anchor="middle">3</text>
  <polygon points="800,410 848,440 800,470 752,440" fill="#D55E00"/>
  <rect x="866" y="410" width="70" height="60" rx="10" fill="none" stroke="#CC79A7" stroke-width="3"/>
  <circle cx="891" cy="430" r="9" fill="none" stroke="#CC79A7" stroke-width="2.5"/>
  <path d="M908,433 l5,5 l9,-11" fill="none" stroke="#CC79A7" stroke-width="2.5"/>
  <text x="990" y="446" font-size="15" fill="#111111" text-anchor="middle">gates + reviewer brief</text>
  <text x="800" y="506" font-size="14" fill="#111111" text-anchor="start">can a rule check it? gate; if not, reviewer</text>

  <!-- ===== Row 4: stop conditions -> loop bound + escalation ===== -->
  <rect x="120" y="576" width="220" height="56" rx="8" fill="#0072B2"/>
  <text x="230" y="610" font-size="15" fill="#FFFFFF" text-anchor="middle">stop conditions</text>
  <line x1="340" y1="604" x2="518" y2="604" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="429" cy="604" r="17" fill="#F7F7F5" stroke="#111111" stroke-width="2"/>
  <text x="429" y="610" font-size="16" fill="#111111" text-anchor="middle">4</text>
  <rect x="752" y="586" width="96" height="36" rx="6" fill="none" stroke="#999999" stroke-width="2.5"/>
  <text x="800" y="609" font-size="13" fill="#999999" text-anchor="middle">orchestrator</text>
  <circle cx="892" cy="604" r="15" fill="none" stroke="#0072B2" stroke-width="3"/>
  <path d="M869,640 a23,23 0 0 1 46,0" fill="none" stroke="#0072B2" stroke-width="3"/>
  <text x="1040" y="600" font-size="15" fill="#111111" text-anchor="middle">loop bound + escalation</text>
  <text x="1040" y="620" font-size="13" fill="#111111" text-anchor="middle">bounds cost and diffusion of responsibility</text>
</svg>
