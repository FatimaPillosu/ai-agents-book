<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 8.2 — Where a generated hypothesis may and may not go</title>
  <desc>A top-to-bottom decision flowchart. A model-generated hypothesis flows into a tagged exploratory record, then to a vermillion diamond asking whether it has been tested by a pre-specified procedure. The no exit returns it to a grey terminus reading remains exploratory, not a finding, marked as where hypothesis laundering is blocked. The yes exit passes through a scientist-owns-the-claim step to a green terminus reading enters result or manuscript.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- hypothesis -->
  <rect x="470" y="62" width="340" height="56" rx="10" fill="none" stroke="#E69F00" stroke-width="3"/>
  <text x="640" y="97" font-size="16" fill="#111111" text-anchor="middle">model-generated hypothesis</text>

  <line x1="640" y1="118" x2="640" y2="176" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- exploratory record cylinder -->
  <path d="M490,196 v28 a150,18 0 0 0 300,0 v-28" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="640" cy="196" rx="150" ry="18" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="640" y="218" font-size="15" fill="#111111" text-anchor="middle">exploratory record (tagged)</text>

  <line x1="640" y1="242" x2="640" y2="268" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- decision diamond -->
  <polygon points="640,270 730,360 640,450 550,360" fill="#D55E00"/>
  <text x="640" y="345" font-size="14" fill="#FFFFFF" text-anchor="middle">tested by</text>
  <text x="640" y="363" font-size="14" fill="#FFFFFF" text-anchor="middle">pre-specified</text>
  <text x="640" y="381" font-size="14" fill="#FFFFFF" text-anchor="middle">procedure?</text>

  <!-- no branch -->
  <text x="470" y="348" font-size="14" fill="#111111" text-anchor="middle">no</text>
  <line x1="550" y1="360" x2="392" y2="360" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="110" y="332" width="280" height="56" rx="8" fill="none" stroke="#999999" stroke-width="2.5"/>
  <text x="250" y="356" font-size="14" fill="#111111" text-anchor="middle">remains exploratory —</text>
  <text x="250" y="376" font-size="14" fill="#111111" text-anchor="middle">not a finding</text>

  <!-- laundering callout -->
  <line x1="250" y1="406" x2="250" y2="390" stroke="#D55E00" stroke-width="1.5"/>
  <text x="250" y="426" font-size="13" fill="#D55E00" text-anchor="middle">hypothesis laundering blocked here</text>

  <!-- yes branch -->
  <text x="668" y="472" font-size="14" fill="#111111" text-anchor="middle">yes</text>
  <line x1="640" y1="450" x2="640" y2="486" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- scientist owns the claim -->
  <circle cx="640" cy="505" r="14" fill="none" stroke="#0072B2" stroke-width="3"/>
  <path d="M614,563 a26,26 0 0 1 52,0" fill="none" stroke="#0072B2" stroke-width="3"/>
  <text x="720" y="524" font-size="14" fill="#111111" text-anchor="start">scientist owns the claim</text>

  <line x1="640" y1="572" x2="640" y2="632" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- green terminus -->
  <rect x="470" y="636" width="340" height="52" rx="8" fill="none" stroke="#009E73" stroke-width="2.5"/>
  <text x="640" y="668" font-size="15" fill="#111111" text-anchor="middle">enters result / manuscript</text>
</svg>
