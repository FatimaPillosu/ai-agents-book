<text x="320.0" y="204.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#009E73" font-weight="700" text-anchor="middle">A</text>
<text x="320.0" y="236.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">accepted: rainfall-backed spike</text>
<text x="640.0" y="204.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#D55E00" font-weight="700" text-anchor="middle">B</text>
<text x="640.0" y="236.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#D55E00" font-weight="400" text-anchor="middle">rejected by rule: no rainfall, exceeds rate limit</text>
<line x1="320.0" y1="246.0" x2="320.0" y2="320.0" stroke="#009E73" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="640.0" y1="246.0" x2="640.0" y2="288.0" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="760.0" y="236.0" width="420.0" height="95.0" rx="8" fill="#F0E442" stroke="none"/>
<text x="772.0" y="260.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="400" text-anchor="start">the agent proposed accepting B too - a</text>
<text x="772.0" y="279.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="400" text-anchor="start">fluent proposal, and simply wrong;</text>
<text x="772.0" y="298.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="400" text-anchor="start">caught by a physical rate-of-change</text>
<text x="772.0" y="316.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="400" text-anchor="start">rule, not by anyone reading the output</text>
<text x="960.0" y="516.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">gap flagged, not filled - the agent may classify a gap; it may never write a value into one</text>
<text x="1180.0" y="478.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#009E73" font-weight="400" text-anchor="middle">A2</text>
<text x="56.0" y="860.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#999999" font-weight="400" text-anchor="start">Every disposition here, including B's rejection, is written to provenance with its reason. [AUTHOR: replace the schematic events with three real</text>
<text x="56.0" y="877.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#999999" font-weight="400" text-anchor="start">ones.]</text>
