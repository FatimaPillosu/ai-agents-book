<rect x="620.0" y="666.0" width="16.0" height="10.0" rx="2" fill="#56B4E9" stroke="none"/>
<rect x="1140.0" y="610.0" width="16.0" height="66.0" rx="2" fill="#56B4E9" stroke="none"/>
<rect x="1160.0" y="588.0" width="16.0" height="88.0" rx="2" fill="#56B4E9" stroke="none"/>
<rect x="1180.0" y="624.0" width="16.0" height="52.0" rx="2" fill="#56B4E9" stroke="none"/>
