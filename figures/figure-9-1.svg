<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 9.1 — Manual transcription versus artefact-linked assembly</title>
  <desc>A two-row comparison. The top row, greyed, shows analysis outputs copied by hand into a figure and typed by hand into a manuscript, with two vermillion divergence-risk markers on the copy steps. The bottom row shows the same analysis outputs feeding a figure and table generation tool and an assembly agent that drafts a manuscript, with a single blue author-control gate and no manual copying.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="ahGrey" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- row labels -->
  <text x="60" y="120" font-size="22" font-weight="bold" fill="#999999">conventional</text>
  <text x="60" y="430" font-size="22" font-weight="bold" fill="#111111">artefact-linked</text>

  <!-- divider -->
  <line x1="40" y1="378" x2="1240" y2="378" stroke="#999999" stroke-width="1"/>

  <!-- ================= TOP ROW (conventional) ================= -->
  <!-- analysis outputs cylinder (sky blue) -->
  <path d="M123,190 v64 a52,13 0 0 0 104,0 v-64" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="175" cy="190" rx="52" ry="13" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="175" y="300" font-size="17" fill="#111111" text-anchor="middle">analysis outputs</text>

  <!-- figure glyph (grey) -->
  <rect x="500" y="180" width="120" height="86" rx="6" fill="none" stroke="#999999" stroke-width="3"/>
  <polyline points="516,246 548,214 574,232 604,196" fill="none" stroke="#999999" stroke-width="3"/>
  <circle cx="548" cy="214" r="4" fill="#999999"/>

  <!-- manuscript document (grey) -->
  <rect x="880" y="176" width="130" height="94" rx="6" fill="none" stroke="#999999" stroke-width="3"/>
  <line x1="900" y1="202" x2="990" y2="202" stroke="#999999" stroke-width="2"/>
  <line x1="900" y1="223" x2="990" y2="223" stroke="#999999" stroke-width="2"/>
  <line x1="900" y1="244" x2="962" y2="244" stroke="#999999" stroke-width="2"/>
  <text x="945" y="300" font-size="17" fill="#999999" text-anchor="middle">manuscript</text>

  <!-- top arrows (grey) with divergence-risk gates -->
  <text x="363" y="200" font-size="16" fill="#999999" text-anchor="middle">hand-copied</text>
  <line x1="230" y1="222" x2="494" y2="222" stroke="#999999" stroke-width="2" marker-end="url(#ahGrey)"/>
  <polygon points="363,206 379,222 363,238 347,222" fill="#D55E00"/>
  <text x="363" y="262" font-size="14" fill="#D55E00" text-anchor="middle">divergence risk</text>

  <text x="752" y="200" font-size="16" fill="#999999" text-anchor="middle">typed by hand</text>
  <line x1="624" y1="222" x2="874" y2="222" stroke="#999999" stroke-width="2" marker-end="url(#ahGrey)"/>
  <polygon points="752,206 768,222 752,238 736,222" fill="#D55E00"/>
  <text x="752" y="262" font-size="14" fill="#D55E00" text-anchor="middle">divergence risk</text>

  <!-- top callout -->
  <text x="650" y="345" font-size="17" fill="#D55E00" text-anchor="middle">each copy can silently diverge</text>

  <!-- ================= BOTTOM ROW (artefact-linked) ================= -->
  <!-- analysis outputs cylinder (sky blue) -->
  <path d="M110,470 v60 a50,12 0 0 0 100,0 v-60" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="160" cy="470" rx="50" ry="12" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="160" y="575" font-size="17" fill="#111111" text-anchor="middle">analysis outputs</text>

  <!-- figure / table generation (green tool box) -->
  <rect x="350" y="458" width="164" height="84" rx="10" fill="#009E73"/>
  <text x="432" y="494" font-size="16" fill="#FFFFFF" text-anchor="middle">figure / table</text>
  <text x="432" y="516" font-size="16" fill="#FFFFFF" text-anchor="middle">generation</text>

  <!-- assembly agent (orange) -->
  <rect x="612" y="455" width="92" height="92" rx="12" fill="none" stroke="#E69F00" stroke-width="3"/>
  <path d="M672,485 A18,18 0 1 1 654,477" fill="none" stroke="#E69F00" stroke-width="3" marker-end="url(#ahO)"/>
  <text x="658" y="575" font-size="17" fill="#111111" text-anchor="middle">assembly agent</text>
  <defs>
    <marker id="ahO" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#E69F00"/>
    </marker>
  </defs>

  <!-- author control gate (blue human) -->
  <circle cx="845" cy="490" r="15" fill="none" stroke="#0072B2" stroke-width="3"/>
  <path d="M819,540 a26,26 0 0 1 52,0" fill="none" stroke="#0072B2" stroke-width="3"/>
  <text x="845" y="575" font-size="17" fill="#0072B2" text-anchor="middle">author control</text>

  <!-- manuscript draft (grey doc) -->
  <rect x="1000" y="455" width="152" height="92" rx="6" fill="none" stroke="#999999" stroke-width="3"/>
  <line x1="1020" y1="482" x2="1132" y2="482" stroke="#999999" stroke-width="2"/>
  <line x1="1020" y1="503" x2="1132" y2="503" stroke="#999999" stroke-width="2"/>
  <line x1="1020" y1="524" x2="1090" y2="524" stroke="#999999" stroke-width="2"/>
  <text x="1076" y="595" font-size="17" fill="#111111" text-anchor="middle">manuscript draft</text>

  <!-- bottom arrows (ink) -->
  <line x1="212" y1="500" x2="348" y2="500" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="516" y1="500" x2="610" y2="500" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="706" y1="500" x2="812" y2="500" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="878" y1="500" x2="998" y2="500" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- bottom callout -->
  <text x="600" y="650" font-size="17" fill="#0072B2" text-anchor="middle">one source, regenerated</text>
</svg>
