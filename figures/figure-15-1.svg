<text x="56.0" y="860.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#999999" font-weight="400" text-anchor="start">Each stage's audited output is the next stage's admissible input; a gap between stages is where governance fails unnoticed.</text>
