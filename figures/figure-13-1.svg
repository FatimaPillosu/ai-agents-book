<text x="56.0" y="860.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#999999" font-weight="400" text-anchor="start">Reading cannot catch this: the property that would betray it is exactly what the generating process suppresses.</text>
