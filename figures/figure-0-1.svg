<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 0.1 — The icon key: six recurring actors</title>
  <desc>A legend of six labelled icons arranged in a grid. A blue head-and-shoulders outline is labelled human; an orange rounded square with a loop arrow is labelled agent; a green wrench is labelled tool; a sky-blue cylinder is labelled data store; a vermillion diamond is labelled gate; a purple head-and-shoulders outline with a small tick is labelled reviewer. Each icon carries a short plain-language description of its role.</desc>
  <defs>
    <marker id="ahO" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#E69F00"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- Row 1, col 1: human (blue) -->
  <circle cx="250" cy="180" r="18" fill="none" stroke="#0072B2" stroke-width="3"/>
  <path d="M220,238 a30,30 0 0 1 60,0" fill="none" stroke="#0072B2" stroke-width="3"/>
  <g fill="#111111" text-anchor="middle">
    <text x="250" y="292" font-size="20" font-weight="bold">human</text>
    <text x="250" y="320" font-size="15">a person who decides</text>
    <text x="250" y="342" font-size="15">and is accountable</text>
  </g>

  <!-- Row 1, col 2: agent (orange) -->
  <rect x="605" y="165" width="70" height="70" rx="14" fill="none" stroke="#E69F00" stroke-width="3"/>
  <path d="M652,208 A17,17 0 1 1 640,183" fill="none" stroke="#E69F00" stroke-width="3" marker-end="url(#ahO)"/>
  <g fill="#111111" text-anchor="middle">
    <text x="640" y="292" font-size="20" font-weight="bold">agent</text>
    <text x="640" y="320" font-size="15">an LLM working in a</text>
    <text x="640" y="342" font-size="15">plan–act–observe loop</text>
  </g>

  <!-- Row 1, col 3: tool (green wrench) -->
  <g stroke="#009E73" stroke-width="11" fill="none" stroke-linecap="round" transform="translate(1035,188)">
    <path d="M12,-12 A18,18 0 1 0 12,12"/>
    <path d="M-12,12 L-32,32"/>
  </g>
  <g fill="#111111" text-anchor="middle">
    <text x="1030" y="292" font-size="20" font-weight="bold">tool</text>
    <text x="1030" y="320" font-size="15">a function or program</text>
    <text x="1030" y="342" font-size="15">the agent calls</text>
  </g>

  <!-- Row 2, col 1: data store (sky cylinder) -->
  <path d="M216,442 v40 a34,10 0 0 0 68,0 v-40" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="250" cy="442" rx="34" ry="10" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <g fill="#111111" text-anchor="middle">
    <text x="250" y="552" font-size="20" font-weight="bold">data store</text>
    <text x="250" y="580" font-size="15">a dataset, file</text>
    <text x="250" y="602" font-size="15">or record</text>
  </g>

  <!-- Row 2, col 2: gate (vermillion diamond) -->
  <polygon points="640,420 686,460 640,500 594,460" fill="#D55E00"/>
  <g fill="#111111" text-anchor="middle">
    <text x="640" y="552" font-size="20" font-weight="bold">gate</text>
    <text x="640" y="580" font-size="15">a check the work</text>
    <text x="640" y="602" font-size="15">must pass</text>
  </g>

  <!-- Row 2, col 3: reviewer (purple head-and-shoulders with tick) -->
  <circle cx="1030" cy="440" r="18" fill="none" stroke="#CC79A7" stroke-width="3"/>
  <path d="M1000,498 a30,30 0 0 1 60,0" fill="none" stroke="#CC79A7" stroke-width="3"/>
  <path d="M1052,452 l10,10 l18,-22" fill="none" stroke="#CC79A7" stroke-width="3"/>
  <g fill="#111111" text-anchor="middle">
    <text x="1030" y="552" font-size="20" font-weight="bold">reviewer</text>
    <text x="1030" y="580" font-size="15">an independent</text>
    <text x="1030" y="602" font-size="15">checker</text>
  </g>
</svg>
