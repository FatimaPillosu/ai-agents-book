<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><marker id="ah22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs>
<rect width="1600" height="900" fill="#F7F7F5"/>
<text x="56.0" y="72.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" fill="#111111" font-weight="600" text-anchor="start">One tool call, four parts</text>
<text x="56.0" y="112.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#3A3A3A" font-weight="400" text-anchor="start">Each of the four parts is a place you can bound what the agent does.</text>
<rect x="417.0" y="204.0" width="36.0" height="36.0" rx="6" fill="none" stroke="#E69F00" stroke-width="2.3"/>
<path d="M427.8,223.8 a7.56,7.56 0 1 1 8.64,6.12" fill="none" stroke="#E69F00" stroke-width="2"/>
<text x="435.0" y="273.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">agent (model)</text>
<path d="M1154.5,232.5 l14.25,-14.25 M1169.5,217.5 a6.0,6.0 0 1 0 7.5,7.5" fill="none" stroke="#009E73" stroke-width="2.5" stroke-linecap="round"/>
<text x="1165.0" y="273.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">tool / interpreter</text>
<line x1="383.0" y1="320.0" x2="487.0" y2="320.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah22)"/>
<text x="435.0" y="304.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">1 declaration is read</text>
<text x="435.0" y="344.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">bounds what the model may even attempt - least privilege lives here</text>
<line x1="469.0" y1="413.3" x2="1131.0" y2="413.3" stroke="#111111" stroke-width="2.1" marker-end="url(#ah22)"/>
<text x="800.0" y="397.3" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">2 invocation</text>
<text x="800.0" y="437.3" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">the model chooses the operation and its arguments</text>
<line x1="1113.0" y1="506.7" x2="1217.0" y2="506.7" stroke="#111111" stroke-width="2.1" marker-end="url(#ah22)"/>
<text x="1165.0" y="490.7" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">3 execution</text>
<text x="1165.0" y="530.7" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">outside the model, and not under its control</text>
<line x1="1131.0" y1="600.0" x2="469.0" y2="600.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah22)"/>
<text x="800.0" y="584.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">4 returned result</text>
<text x="800.0" y="624.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">this becomes the loop's observation</text>
<path d="M355.0,679.2 a80.0,11.200000000000001 0 0 1 160,0 v57.599999999999994 a80.0,11.200000000000001 0 0 1 -160,0 z" fill="none" stroke="#56B4E9" stroke-width="2.2"/>
<path d="M355.0,679.2 a80.0,11.200000000000001 0 0 0 160,0" fill="none" stroke="#56B4E9" stroke-width="2.2"/>
<text x="435.0" y="713.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">state / memory</text>
<text x="545.0" y="700.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">the result is written to state</text>
<rect x="940.0" y="668.0" width="540.0" height="76.3" rx="8" fill="#F0E442" stroke="none"/>
<text x="952.0" y="692.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="400" text-anchor="start">a plausible wrong answer at step 4 is worse than</text>
<text x="952.0" y="711.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="400" text-anchor="start">an error - it defeats the loop's only means of</text>
<text x="952.0" y="730.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="400" text-anchor="start">correction</text>
<text x="56.0" y="860.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#999999" font-weight="400" text-anchor="start">A correct tool can still be pointed at the wrong quantity: the invocation, not the execution, is where that happens.</text>
</svg>
