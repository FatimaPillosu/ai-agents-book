<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 1.2 — The taxonomy as nesting: model inside agent inside workflow</title>
  <desc>A nested diagram. The outer box, labelled agentic workflow, contains a specification feeding an inner box labelled AI agent, which contains an LLM connected to a plan–act–observe loop alongside tools and state. The agent's output passes through a verification gate that either proceeds to a human decision point or returns to the agent.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="ahO" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#E69F00"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- outer container: agentic workflow -->
  <rect x="40" y="60" width="1200" height="600" rx="16" fill="none" stroke="#999999" stroke-width="3"/>
  <text x="64" y="100" font-size="22" fill="#111111">agentic workflow</text>

  <!-- specification tag (human/decision blue) -->
  <rect x="80" y="332" width="152" height="52" rx="8" fill="#0072B2"/>
  <text x="156" y="365" font-size="18" fill="#FFFFFF" text-anchor="middle">specification</text>
  <line x1="236" y1="358" x2="284" y2="358" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- AI agent container -->
  <rect x="290" y="170" width="460" height="400" rx="14" fill="none" stroke="#E69F00" stroke-width="3"/>
  <text x="320" y="207" font-size="22" fill="#E69F00">AI agent</text>

  <!-- LLM box -->
  <rect x="330" y="240" width="120" height="64" rx="8" fill="#E69F00"/>
  <text x="390" y="279" font-size="20" fill="#111111" text-anchor="middle">LLM</text>

  <!-- plan–act–observe loop ring -->
  <line x1="452" y1="272" x2="530" y2="271" stroke="#111111" stroke-width="1.5"/>
  <path d="M580,225 A45,45 0 1 1 535,270" fill="none" stroke="#E69F00" stroke-width="4" marker-end="url(#ahO)"/>
  <text x="580" y="341" font-size="16" fill="#111111" text-anchor="middle">plan – act – observe</text>

  <!-- tools glyph (wrench, tool green) -->
  <g stroke="#009E73" stroke-width="13" fill="none" stroke-linecap="round" transform="translate(395,455)">
    <path d="M18,-18 A26,26 0 1 0 18,18"/>
    <path d="M-19,19 L-50,50"/>
  </g>
  <text x="380" y="545" font-size="17" fill="#111111" text-anchor="middle">tools</text>

  <!-- state / memory cylinder (data-store sky blue) -->
  <path d="M570,435 v75 a60,14 0 0 0 120,0 v-75" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="630" cy="435" rx="60" ry="14" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="630" y="545" font-size="17" fill="#111111" text-anchor="middle">state / memory</text>

  <!-- agent to gate -->
  <line x1="754" y1="370" x2="818" y2="370" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- verification gate diamond (vermillion) -->
  <polygon points="900,313 977,370 900,427 823,370" fill="#D55E00"/>
  <text x="900" y="366" font-size="15" fill="#FFFFFF" text-anchor="middle">verification</text>
  <text x="900" y="386" font-size="15" fill="#FFFFFF" text-anchor="middle">gate</text>

  <!-- pass exit to human decision -->
  <line x1="979" y1="370" x2="1070" y2="370" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="1024" y="352" font-size="16" fill="#111111" text-anchor="middle">pass</text>

  <!-- human decision icon (blue) -->
  <circle cx="1120" cy="330" r="16" fill="none" stroke="#0072B2" stroke-width="3"/>
  <path d="M1092,394 a28,28 0 0 1 56,0" fill="none" stroke="#0072B2" stroke-width="3"/>
  <text x="1120" y="428" font-size="17" fill="#111111" text-anchor="middle">human decision</text>

  <!-- fail return to agent -->
  <path d="M900,431 L900,620 L520,620 L520,578" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="920" y="480" font-size="16" fill="#111111">fail</text>
</svg>
