<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 13.6 — Confident extrapolation, bounded by its support</title>
  <desc>A left-to-right trace. A sky-blue data artefact marks a support range. An agent generalises from it and emits a confident claim whose scope, shown by a vermillion bracket, overshoots the support range. A vermillion scope-versus-support gate detects the overshoot and routes the claim, via an out-of-support exit, to a box that flags it as a hypothesis for independent test. A callout marks the claim as reaching past the data while reading like a supported result.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="ahR" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#D55E00"/>
    </marker>
    <marker id="ahO" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#E69F00"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- data + support range card -->
  <rect x="70" y="248" width="240" height="104" rx="8" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="190" y="286" font-size="16" fill="#111111" text-anchor="middle">data + support range</text>
  <!-- marked support bar -->
  <line x1="110" y1="322" x2="270" y2="322" stroke="#111111" stroke-width="3"/>
  <line x1="110" y1="312" x2="110" y2="332" stroke="#111111" stroke-width="3"/>
  <line x1="270" y1="312" x2="270" y2="332" stroke="#111111" stroke-width="3"/>
  <line x1="310" y1="300" x2="388" y2="300" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- agent generalises -->
  <rect x="392" y="258" width="180" height="86" rx="12" fill="none" stroke="#E69F00" stroke-width="3"/>
  <path d="M540,271 a11,11 0 1 1 -7,-4" fill="none" stroke="#E69F00" stroke-width="2.5" marker-end="url(#ahO)"/>
  <text x="482" y="306" font-size="16" fill="#111111" text-anchor="middle">agent generalises</text>
  <line x1="572" y1="300" x2="648" y2="300" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- confident claim card -->
  <rect x="652" y="248" width="248" height="104" rx="8" fill="#E69F00"/>
  <text x="776" y="286" font-size="16" fill="#111111" text-anchor="middle">confident claim</text>
  <!-- support portion (grey) + overshoot (vermillion) -->
  <line x1="668" y1="322" x2="792" y2="322" stroke="#999999" stroke-width="3"/>
  <line x1="792" y1="322" x2="886" y2="322" stroke="#D55E00" stroke-width="4"/>
  <!-- vermillion bracket over the overshoot -->
  <path d="M792,306 L792,298 L886,298 L886,306" fill="none" stroke="#D55E00" stroke-width="2.5"/>
  <line x1="900" y1="300" x2="936" y2="300" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- scope vs support gate -->
  <polygon points="1010,235 1085,300 1010,365 935,300" fill="#D55E00"/>
  <text x="1010" y="296" font-size="15" fill="#FFFFFF" text-anchor="middle">scope vs</text>
  <text x="1010" y="316" font-size="15" fill="#FFFFFF" text-anchor="middle">support</text>

  <!-- out of support exit down to hypothesis box -->
  <line x1="1010" y1="365" x2="1010" y2="466" stroke="#D55E00" stroke-width="2.5" marker-end="url(#ahR)"/>
  <text x="1028" y="418" font-size="15" fill="#D55E00" text-anchor="start">out of support</text>

  <!-- flag as hypothesis box -->
  <rect x="720" y="470" width="380" height="90" rx="8" fill="#0072B2"/>
  <text x="910" y="508" font-size="17" fill="#FFFFFF" text-anchor="middle">flag as hypothesis →</text>
  <text x="910" y="533" font-size="17" fill="#FFFFFF" text-anchor="middle">independent test</text>

  <!-- failure-point callout -->
  <rect x="560" y="88" width="620" height="74" rx="8" fill="#D55E00"/>
  <text x="870" y="120" font-size="17" fill="#FFFFFF" text-anchor="middle">failure point: claim reaches past the data;</text>
  <text x="870" y="144" font-size="17" fill="#FFFFFF" text-anchor="middle">reads the same as a supported one</text>
  <line x1="776" y1="162" x2="776" y2="246" stroke="#D55E00" stroke-width="2.5" marker-end="url(#ahR)"/>
</svg>
