<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 8.4 — The three-track intercomparison as an orchestrated sequence</title>
  <desc>A top-to-bottom sequence diagram with four actor lanes (scientist, orchestration agent, HPC scheduler and provenance store) and a separated vermillion evaluation lane on the right. Numbered steps show the scientist authoring a protocol and three track configurations, the agent expanding physics, data-driven and hybrid configs into runs, submitting them, receiving states, recording provenance and flagging anomalies, then completed outputs passing to independent held-out evaluation whose scores return to the scientist. A bracket marks the agent's steps as orchestration only, with no scoring.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- lane headers -->
  <circle cx="180" cy="72" r="14" fill="none" stroke="#0072B2" stroke-width="3"/>
  <path d="M154,102 a26,26 0 0 1 52,0" fill="none" stroke="#0072B2" stroke-width="3"/>
  <text x="180" y="128" font-size="14" fill="#111111" text-anchor="middle">scientist</text>

  <rect x="395" y="56" width="70" height="46" rx="8" fill="none" stroke="#E69F00" stroke-width="3"/>
  <text x="430" y="128" font-size="14" fill="#111111" text-anchor="middle">orchestration agent</text>

  <rect x="646" y="58" width="68" height="44" rx="6" fill="none" stroke="#009E73" stroke-width="2.5"/>
  <text x="680" y="128" font-size="14" fill="#111111" text-anchor="middle">HPC scheduler</text>

  <path d="M860,66 v28 a40,10 0 0 0 80,0 v-28" fill="none" stroke="#56B4E9" stroke-width="2.5"/>
  <ellipse cx="900" cy="66" rx="40" ry="10" fill="none" stroke="#56B4E9" stroke-width="2.5"/>
  <text x="900" y="128" font-size="14" fill="#111111" text-anchor="middle">provenance store</text>

  <rect x="1040" y="56" width="196" height="52" rx="8" fill="none" stroke="#D55E00" stroke-width="2.5"/>
  <text x="1138" y="80" font-size="13" fill="#D55E00" text-anchor="middle">independent evaluation</text>
  <text x="1138" y="98" font-size="13" fill="#D55E00" text-anchor="middle">(Ch. 11)</text>

  <!-- lifelines -->
  <line x1="180" y1="150" x2="180" y2="660" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="430" y1="150" x2="430" y2="660" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="680" y1="150" x2="680" y2="660" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="900" y1="150" x2="900" y2="660" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="1138" y1="150" x2="1138" y2="660" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- orchestration bracket -->
  <path d="M100,235 L88,235 L88,505 L100,505" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="70" y="370" font-size="13" fill="#999999" text-anchor="middle" transform="rotate(-90 70 370)">orchestration only — no scoring here</text>

  <!-- 1 -->
  <text x="305" y="185" font-size="13" fill="#111111" text-anchor="middle">1 author protocol + 3 track configs</text>
  <line x1="180" y1="200" x2="430" y2="200" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 2 self-loop -->
  <path d="M430,240 h60 v28 h-60" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="500" y="258" font-size="13" fill="#111111" text-anchor="start">2 expand: physics · data-driven · hybrid</text>

  <!-- 3 -->
  <text x="555" y="308" font-size="13" fill="#111111" text-anchor="middle">3 submit runs</text>
  <line x1="430" y1="322" x2="680" y2="322" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 4 -->
  <text x="555" y="362" font-size="13" fill="#111111" text-anchor="middle">4 run states</text>
  <line x1="680" y1="376" x2="430" y2="376" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 5 -->
  <text x="665" y="422" font-size="13" fill="#111111" text-anchor="middle">5 record provenance</text>
  <line x1="430" y1="436" x2="900" y2="436" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 6 -->
  <text x="305" y="482" font-size="13" fill="#111111" text-anchor="middle">6 flag anomalies</text>
  <line x1="430" y1="496" x2="180" y2="496" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 7 -->
  <text x="785" y="552" font-size="13" fill="#111111" text-anchor="middle">7 held-out evaluation</text>
  <line x1="430" y1="566" x2="1138" y2="566" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- 8 -->
  <text x="655" y="612" font-size="13" fill="#111111" text-anchor="middle">8 scores to scientist</text>
  <line x1="1138" y1="626" x2="180" y2="626" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
</svg>
