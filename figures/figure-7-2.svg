<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 7.2 — From exploratory notebook to governed pipeline</title>
  <desc>A before-and-after diagram. The top half shows a grey notebook box with an unordered cluster of cells (load, regrid, threshold, plot) and a single arrow labelled looked reasonable, annotated in vermillion as no independent reader. The bottom half shows the same four steps as an ordered green tool chain feeding an orange author agent, then three vermillion gate diamonds for tests, hooks and independent review, then a blue human owner, all sitting above a sky-blue version-control cylinder and annotated reader before merge.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="ahG" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#999999"/>
    </marker>
    <marker id="ahO" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#E69F00"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- BEFORE -->
  <text x="70" y="92" font-size="18" fill="#111111">before</text>

  <!-- notebook -->
  <rect x="110" y="110" width="380" height="180" rx="10" fill="none" stroke="#999999" stroke-width="3"/>
  <text x="130" y="140" font-size="17" fill="#111111">notebook</text>
  <rect x="150" y="155" width="95" height="38" rx="6" fill="#F7F7F5" stroke="#999999" stroke-width="2"/>
  <text x="197" y="180" font-size="15" fill="#111111" text-anchor="middle">load</text>
  <rect x="320" y="150" width="95" height="38" rx="6" fill="#F7F7F5" stroke="#999999" stroke-width="2"/>
  <text x="367" y="175" font-size="15" fill="#111111" text-anchor="middle">regrid</text>
  <rect x="200" y="228" width="110" height="38" rx="6" fill="#F7F7F5" stroke="#999999" stroke-width="2"/>
  <text x="255" y="253" font-size="15" fill="#111111" text-anchor="middle">threshold</text>
  <rect x="360" y="228" width="95" height="38" rx="6" fill="#F7F7F5" stroke="#999999" stroke-width="2"/>
  <text x="407" y="253" font-size="15" fill="#111111" text-anchor="middle">plot</text>

  <!-- looked reasonable arrow -->
  <line x1="490" y1="200" x2="630" y2="200" stroke="#999999" stroke-width="2" marker-end="url(#ahG)"/>
  <text x="560" y="188" font-size="15" fill="#999999" text-anchor="middle">looked reasonable</text>

  <!-- no independent reader callout -->
  <line x1="748" y1="196" x2="634" y2="200" stroke="#D55E00" stroke-width="1.5"/>
  <text x="758" y="205" font-size="16" fill="#D55E00">no independent reader</text>

  <!-- AFTER -->
  <text x="70" y="382" font-size="18" fill="#111111">after</text>

  <!-- governed pipeline border -->
  <rect x="90" y="400" width="560" height="180" rx="12" fill="none" stroke="#999999" stroke-width="3"/>
  <text x="110" y="428" font-size="17" fill="#111111">governed pipeline</text>

  <!-- ordered green tool chain -->
  <rect x="115" y="475" width="100" height="44" rx="6" fill="none" stroke="#009E73" stroke-width="2.5"/>
  <text x="165" y="503" font-size="15" fill="#111111" text-anchor="middle">load</text>
  <line x1="215" y1="497" x2="238" y2="497" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="240" y="475" width="100" height="44" rx="6" fill="none" stroke="#009E73" stroke-width="2.5"/>
  <text x="290" y="503" font-size="15" fill="#111111" text-anchor="middle">regrid</text>
  <line x1="340" y1="497" x2="368" y2="497" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="370" y="475" width="100" height="44" rx="6" fill="none" stroke="#009E73" stroke-width="2.5"/>
  <text x="420" y="503" font-size="15" fill="#111111" text-anchor="middle">threshold</text>
  <line x1="470" y1="497" x2="493" y2="497" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="495" y="475" width="100" height="44" rx="6" fill="none" stroke="#009E73" stroke-width="2.5"/>
  <text x="545" y="503" font-size="15" fill="#111111" text-anchor="middle">plot</text>

  <!-- plot -> author agent -->
  <line x1="595" y1="497" x2="655" y2="497" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- author agent -->
  <rect x="660" y="470" width="115" height="52" rx="10" fill="none" stroke="#E69F00" stroke-width="3"/>
  <path d="M710,482 A13,13 0 1 1 699,488" fill="none" stroke="#E69F00" stroke-width="3" marker-end="url(#ahO)"/>
  <text x="740" y="502" font-size="14" fill="#111111" text-anchor="middle">author agent</text>

  <!-- author -> tests -->
  <line x1="775" y1="497" x2="810" y2="497" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- gate diamonds -->
  <polygon points="860,450 908,498 860,546 812,498" fill="#D55E00"/>
  <text x="860" y="503" font-size="15" fill="#FFFFFF" text-anchor="middle">tests</text>
  <line x1="908" y1="498" x2="935" y2="498" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <polygon points="985,450 1033,498 985,546 937,498" fill="#D55E00"/>
  <text x="985" y="503" font-size="15" fill="#FFFFFF" text-anchor="middle">hooks</text>
  <line x1="1033" y1="498" x2="1060" y2="498" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <polygon points="1110,450 1158,498 1110,546 1062,498" fill="#D55E00"/>
  <text x="1110" y="494" font-size="13" fill="#FFFFFF" text-anchor="middle">independent</text>
  <text x="1110" y="510" font-size="13" fill="#FFFFFF" text-anchor="middle">review</text>

  <!-- review -> human -->
  <line x1="1158" y1="498" x2="1188" y2="492" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- human owner -->
  <circle cx="1215" cy="475" r="14" fill="none" stroke="#0072B2" stroke-width="3"/>
  <path d="M1189,533 a26,26 0 0 1 52,0" fill="none" stroke="#0072B2" stroke-width="3"/>
  <text x="1215" y="560" font-size="15" fill="#111111" text-anchor="middle">human owner</text>

  <!-- reader before merge callout -->
  <line x1="1050" y1="438" x2="1105" y2="470" stroke="#D55E00" stroke-width="1.5"/>
  <text x="1010" y="432" font-size="15" fill="#D55E00" text-anchor="middle">reader before merge</text>

  <!-- version control cylinder -->
  <line x1="360" y1="590" x2="360" y2="622" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M265,640 v30 a95,16 0 0 0 190,0 v-30" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="360" cy="640" rx="95" ry="16" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="360" y="646" font-size="15" fill="#111111" text-anchor="middle">version control</text>
</svg>
