<text x="56.0" y="860.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#999999" font-weight="400" text-anchor="start">A reviewer that almost never returns a fault is a broken reviewer, not a flawless author.</text>
