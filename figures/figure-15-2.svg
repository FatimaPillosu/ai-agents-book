<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><marker id="ah152" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs>
<rect width="1600" height="900" fill="#F7F7F5"/>
<text x="56.0" y="72.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" fill="#111111" font-weight="600" text-anchor="start">One gated stage, from specification unit to author decision</text>
<text x="56.0" y="112.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#3A3A3A" font-weight="400" text-anchor="start">The author decides at the gate, not after the workflow has finished.</text>
<rect x="100.0" y="193.0" width="232.0" height="74.0" rx="18" fill="none" stroke="#0072B2" stroke-width="2.2"/>
<text x="216.0" y="236.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">specification unit</text>
<rect x="490.0" y="204.0" width="36.0" height="36.0" rx="6" fill="none" stroke="#E69F00" stroke-width="2.3"/>
<path d="M500.8,223.8 a7.56,7.56 0 1 1 8.64,6.12" fill="none" stroke="#E69F00" stroke-width="2"/>
<text x="508.0" y="273.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">agent</text>
<path d="M789.5,232.5 l14.25,-14.25 M804.5,217.5 a6.0,6.0 0 1 0 7.5,7.5" fill="none" stroke="#009E73" stroke-width="2.5" stroke-linecap="round"/>
<text x="800.0" y="273.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">tools &amp; data</text>
<polygon points="1092.0,176.0 1208.0,230 1092.0,284.0 976.0,230" fill="none" stroke="#D55E00" stroke-width="2.4"/>
<text x="1092.0" y="236.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">gate + reviewer</text>
<circle cx="1384.0" cy="210.4" r="9.6" fill="none" stroke="#0072B2" stroke-width="2.3"/>
<path d="M1368.0,235.2 a16,14.4 0 0 1 32,0" fill="none" stroke="#0072B2" stroke-width="2.3"/>
<text x="1384.0" y="273.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">author</text>
<line x1="250.0" y1="318.0" x2="474.0" y2="318.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah152)"/>
<text x="362.0" y="302.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">1 objective, inputs, criteria, stop</text>
<line x1="542.0" y1="385.7" x2="766.0" y2="385.7" stroke="#111111" stroke-width="2.1" marker-end="url(#ah152)"/>
<text x="654.0" y="369.7" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">2 call tools, transform</text>
<text x="654.0" y="409.7" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">calculations go to tools, not prose</text>
<line x1="542.0" y1="453.3" x2="1058.0" y2="453.3" stroke="#111111" stroke-width="2.1" marker-end="url(#ah152)"/>
<text x="800.0" y="437.3" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">3 write output + provenance</text>
<text x="800.0" y="477.3" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">any new assumption goes to the registry, not left implicit</text>
<line x1="542.0" y1="521.0" x2="1058.0" y2="521.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah152)"/>
<text x="800.0" y="505.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">4 submit for check</text>
<line x1="1058.0" y1="588.7" x2="542.0" y2="588.7" stroke="#111111" stroke-width="2.1" marker-end="url(#ah152)"/>
<text x="800.0" y="572.7" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">5 fail - return (within budget)</text>
<text x="800.0" y="612.7" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">loop bounded by the stop conditions</text>
<line x1="1126.0" y1="656.3" x2="1350.0" y2="656.3" stroke="#111111" stroke-width="2.1" marker-end="url(#ah152)"/>
<text x="1238.0" y="640.3" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">5 pass</text>
<line x1="1332.0" y1="724.0" x2="1436.0" y2="724.0" stroke="#D55E00" stroke-width="2.1" marker-end="url(#ah152)"/>
<text x="1384.0" y="708.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">6 accept / override / return</text>
<text x="1384.0" y="748.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">the author decides at the gate, not after</text>
<text x="56.0" y="860.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#999999" font-weight="400" text-anchor="start">One decision per gate is the price of a workflow whose every step is attributable.</text>
</svg>
