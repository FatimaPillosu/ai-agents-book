<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 12.2 — The trust boundary: what the agent may reach, and what waits on a human</title>
  <desc>An architecture diagram with a central grey box labelled trusted zone containing an AI agent, a specification and a small set of permitted tools annotated least privilege and deny by default. On the left, three untrusted sources (external documents, web content and third-party data) pass through a vermillion validation gate into the zone as data. On the right, three consequential actions (write to shared system, send communication, irreversible command) sit outside the zone and are reachable only through a second vermillion human gate with a blue human icon. The edges of the grey box are labelled trust boundary.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- left untrusted sources -->
  <rect x="55" y="182" width="150" height="60" rx="8" fill="none" stroke="#999999" stroke-width="2.5"/>
  <text x="130" y="209" font-size="15" fill="#111111" text-anchor="middle">external</text>
  <text x="130" y="228" font-size="15" fill="#111111" text-anchor="middle">documents</text>

  <rect x="55" y="302" width="150" height="60" rx="8" fill="none" stroke="#999999" stroke-width="2.5"/>
  <text x="130" y="338" font-size="15" fill="#111111" text-anchor="middle">web content</text>

  <rect x="55" y="422" width="150" height="60" rx="8" fill="none" stroke="#999999" stroke-width="2.5"/>
  <text x="130" y="458" font-size="15" fill="#111111" text-anchor="middle">third-party data</text>

  <!-- arrows into validate gate -->
  <line x1="205" y1="212" x2="292" y2="315" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="205" y1="332" x2="288" y2="332" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="205" y1="452" x2="292" y2="350" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- validate gate -->
  <polygon points="322,300 354,332 322,364 290,332" fill="#D55E00"/>
  <text x="322" y="404" font-size="14" fill="#111111" text-anchor="middle">validate · quote as data</text>

  <!-- gate to zone -->
  <line x1="354" y1="332" x2="428" y2="332" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- trusted zone -->
  <rect x="430" y="150" width="390" height="380" rx="14" fill="none" stroke="#999999" stroke-width="3"/>
  <text x="625" y="182" font-size="19" fill="#111111" text-anchor="middle">trusted zone</text>
  <text x="445" y="518" font-size="13" fill="#111111">trust boundary</text>

  <!-- AI agent -->
  <rect x="545" y="222" width="160" height="64" rx="12" fill="none" stroke="#E69F00" stroke-width="3"/>
  <text x="625" y="261" font-size="18" fill="#E69F00" text-anchor="middle">AI agent</text>

  <!-- specification tag -->
  <rect x="465" y="392" width="130" height="46" rx="8" fill="#0072B2"/>
  <text x="530" y="421" font-size="15" fill="#FFFFFF" text-anchor="middle">specification</text>

  <!-- permitted tools (wrench) -->
  <g stroke="#009E73" stroke-width="10" fill="none" stroke-linecap="round" transform="translate(715,398)">
    <path d="M13,-13 A19,19 0 1 0 13,13"/>
    <path d="M-14,14 L-36,36"/>
  </g>
  <text x="712" y="462" font-size="14" fill="#111111" text-anchor="middle">permitted tools</text>
  <text x="712" y="482" font-size="13" fill="#999999" text-anchor="middle">least privilege</text>
  <text x="712" y="500" font-size="13" fill="#999999" text-anchor="middle">deny by default</text>

  <!-- agent out through human gate -->
  <line x1="705" y1="270" x2="895" y2="322" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- human icon above human gate -->
  <circle cx="930" cy="235" r="13" fill="none" stroke="#0072B2" stroke-width="3"/>
  <path d="M908,279 a22,22 0 0 1 44,0" fill="none" stroke="#0072B2" stroke-width="3"/>

  <!-- human gate -->
  <polygon points="930,298 964,332 930,366 896,332" fill="#D55E00"/>
  <text x="930" y="328" font-size="13" fill="#FFFFFF" text-anchor="middle">human</text>
  <text x="930" y="343" font-size="13" fill="#FFFFFF" text-anchor="middle">gate</text>

  <!-- human gate to consequential actions -->
  <line x1="964" y1="332" x2="1065" y2="212" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="966" y1="332" x2="1065" y2="332" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="964" y1="332" x2="1065" y2="452" stroke="#111111" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- right consequential actions -->
  <rect x="1070" y="182" width="170" height="60" rx="8" fill="none" stroke="#999999" stroke-width="2.5"/>
  <text x="1155" y="209" font-size="15" fill="#111111" text-anchor="middle">write to</text>
  <text x="1155" y="228" font-size="15" fill="#111111" text-anchor="middle">shared system</text>

  <rect x="1070" y="302" width="170" height="60" rx="8" fill="none" stroke="#999999" stroke-width="2.5"/>
  <text x="1155" y="338" font-size="15" fill="#111111" text-anchor="middle">send communication</text>

  <rect x="1070" y="422" width="170" height="60" rx="8" fill="none" stroke="#999999" stroke-width="2.5"/>
  <text x="1155" y="458" font-size="15" fill="#111111" text-anchor="middle">irreversible command</text>
</svg>
