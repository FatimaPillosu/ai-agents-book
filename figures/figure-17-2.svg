<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><marker id="ah172" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs>
<rect width="1600" height="900" fill="#F7F7F5"/>
<text x="56.0" y="72.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" fill="#111111" font-weight="600" text-anchor="start">What a reviewer can catch, and what needs the record</text>
<text x="56.0" y="112.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#3A3A3A" font-weight="400" text-anchor="start">Two of the six can be caught from the manuscript alone.</text>
<path d="M215.5,285.5 l14.25,-14.25 M230.5,270.5 a6.0,6.0 0 1 0 7.5,7.5" fill="none" stroke="#009E73" stroke-width="2.5" stroke-linecap="round"/>
<text x="270.0" y="263.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#3A3A3A" font-weight="600" text-anchor="start">catchable by a check</text>
<text x="270.0" y="287.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#3A3A3A" font-weight="600" text-anchor="start">the reviewer can run</text>
<rect x="560.0" y="205.0" width="320.0" height="54.0" rx="10" fill="none" stroke="#111111" stroke-width="2.2"/>
<text x="720.0" y="238.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">fabricated citations</text>
<text x="920.0" y="238.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">resolve every DOI - the reviewer's cheapest action</text>
<rect x="560.0" y="283.0" width="320.0" height="54.0" rx="10" fill="none" stroke="#111111" stroke-width="2.2"/>
<text x="720.0" y="316.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">confident extrapolation</text>
<text x="920.0" y="316.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">compare the scope of the claim to the scope of the evidence</text>
<line x1="56.0" y1="360.0" x2="1544.0" y2="360.0" stroke="#111111" stroke-width="1.4"/>
<path d="M204,442.76 a23.0,4.760000000000001 0 0 1 46,0 v24.479999999999997 a23.0,4.760000000000001 0 0 1 -46,0 z" fill="none" stroke="#56B4E9" stroke-width="2.2"/>
<path d="M204,442.76 a23.0,4.760000000000001 0 0 0 46,0" fill="none" stroke="#56B4E9" stroke-width="2.2"/>
<text x="270.0" y="443.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#3A3A3A" font-weight="600" text-anchor="start">catchable only from</text>
<text x="270.0" y="467.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#3A3A3A" font-weight="600" text-anchor="start">the record</text>
<rect x="560.0" y="385.0" width="320.0" height="54.0" rx="10" fill="none" stroke="#111111" stroke-width="2.2"/>
<text x="720.0" y="418.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">specification drift</text>
<text x="920.0" y="418.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">the check is the original specification, held fixed and re-read</text>
<rect x="560.0" y="463.0" width="320.0" height="54.0" rx="10" fill="none" stroke="#111111" stroke-width="2.2"/>
<text x="720.0" y="496.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">context loss</text>
<text x="920.0" y="496.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">the check is an assertion against state the reviewer cannot see</text>
<line x1="56.0" y1="540.0" x2="1544.0" y2="540.0" stroke="#111111" stroke-width="1.4"/>
<rect x="208.0" y="632.0" width="36.0" height="5.0" rx="2" fill="#999999" stroke="none"/>
<text x="270.0" y="623.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#3A3A3A" font-weight="600" text-anchor="start">beyond reach, with or</text>
<text x="270.0" y="647.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#3A3A3A" font-weight="600" text-anchor="start">without the record</text>
<rect x="560.0" y="565.0" width="320.0" height="54.0" rx="10" fill="none" stroke="#111111" stroke-width="2.2"/>
<text x="720.0" y="598.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">silent unit errors</text>
<text x="920.0" y="598.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">only if an invariant is checkable from the reported numbers</text>
<rect x="560.0" y="643.0" width="320.0" height="54.0" rx="10" fill="none" stroke="#111111" stroke-width="2.2"/>
<text x="720.0" y="676.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">over-agreeable review</text>
<text x="920.0" y="676.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">leaves no external trace at all</text>
<path d="M166,366 h-16 v168 h16" fill="none" stroke="#D55E00" stroke-width="1.8"/>
<text x="60.0" y="440.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#D55E00" font-weight="400" text-anchor="start">two of six</text>
<text x="60.0" y="458.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#D55E00" font-weight="400" text-anchor="start">need the</text>
<text x="60.0" y="477.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#D55E00" font-weight="400" text-anchor="start">record</text>
<text x="270.0" y="745.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#999999" font-weight="400" text-anchor="start">two more are beyond reach either way - say so in the assessment</text>
<rect x="56.0" y="800.0" width="1488.0" height="38.8" rx="8" fill="#F0E442" stroke="none"/>
<text x="68.0" y="824.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="400" text-anchor="start">what would have caught it if this step had been wrong?</text>
</svg>
