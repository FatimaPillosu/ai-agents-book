<text x="800.0" y="534.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle">5 explain (no decision)</text>
<text x="800.0" y="574.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="middle">reads the scores and the fixed definitions; writes nothing to the record</text>
