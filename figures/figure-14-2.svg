<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 14.2 — Who computes, who explains, who decides</title>
  <desc>A top-to-bottom sequence with four lanes: user, deterministic core, an optional tutoring tier, and a human decision. The user requests verification; the core computes and returns exact scores; the user asks the tutoring tier what they mean and receives a plain-language explanation marked no decision; the user may request a further diagnostic, which the core recomputes exactly; finally the user decides and records the reported scores. A callout marks that decision authority stays human and that observations stay local.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="ahG" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#009E73"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- lane headers -->
  <!-- user (blue human) -->
  <circle cx="230" cy="62" r="13" fill="none" stroke="#0072B2" stroke-width="3"/>
  <path d="M207,106 a23,23 0 0 1 46,0" fill="none" stroke="#0072B2" stroke-width="3"/>
  <text x="230" y="140" font-size="18" fill="#111111" text-anchor="middle">user</text>

  <!-- deterministic core (green wrench) -->
  <g stroke="#009E73" stroke-width="9" fill="none" stroke-linecap="round" transform="translate(632,66)">
    <path d="M13,-13 A19,19 0 1 0 13,13"/>
    <path d="M-13,13 L-34,34"/>
  </g>
  <text x="640" y="140" font-size="17" fill="#111111" text-anchor="middle">deterministic core</text>

  <!-- tutoring tier (orange agent, dashed = optional) -->
  <rect x="1016" y="44" width="48" height="48" rx="12" fill="none" stroke="#E69F00" stroke-width="3" stroke-dasharray="7 5"/>
  <path d="M1032,60 a12,12 0 1 1 -4,14" fill="none" stroke="#E69F00" stroke-width="3" marker-end="url(#ah)"/>
  <text x="1040" y="120" font-size="16" fill="#111111" text-anchor="middle">tutoring tier (optional)</text>
  <text x="1040" y="142" font-size="12" fill="#999999" text-anchor="middle">reads scores,</text>
  <text x="1040" y="158" font-size="12" fill="#999999" text-anchor="middle">writes nothing to the record</text>

  <!-- lifelines -->
  <line x1="230" y1="172" x2="230" y2="632" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="640" y1="172" x2="640" y2="632" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="1040" y1="172" x2="1040" y2="632" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- step 1 -->
  <rect x="260" y="203" width="150" height="18" fill="#F7F7F5"/>
  <text x="435" y="215" font-size="15" fill="#111111" text-anchor="middle">1 request verification</text>
  <line x1="232" y1="228" x2="638" y2="228" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- step 2 self-loop on core -->
  <path d="M648,266 h64 v22 h-64" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="726" y="283" font-size="14" fill="#111111" text-anchor="start">2 compute scores (exact)</text>

  <!-- step 3 -->
  <rect x="380" y="311" width="120" height="18" fill="#F7F7F5"/>
  <text x="435" y="323" font-size="15" fill="#111111" text-anchor="middle">3 return scores</text>
  <line x1="638" y1="336" x2="232" y2="336" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- step 4 -->
  <rect x="545" y="365" width="190" height="18" fill="#F7F7F5"/>
  <text x="635" y="378" font-size="15" fill="#111111" text-anchor="middle">4 what does this mean?</text>
  <line x1="232" y1="392" x2="1038" y2="392" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- step 5 -->
  <rect x="545" y="421" width="190" height="18" fill="#F7F7F5"/>
  <text x="635" y="434" font-size="15" fill="#111111" text-anchor="middle">5 explain (no decision)</text>
  <line x1="1038" y1="448" x2="232" y2="448" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- step 6 -->
  <rect x="365" y="477" width="150" height="18" fill="#F7F7F5"/>
  <text x="435" y="490" font-size="15" fill="#111111" text-anchor="middle">6 request diagnostic</text>
  <line x1="232" y1="504" x2="638" y2="504" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- step 7 self-loop on core -->
  <path d="M648,530 h64 v22 h-64" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="726" y="547" font-size="14" fill="#111111" text-anchor="start">7 recompute (exact)</text>

  <!-- step 8 decision in user lane -->
  <rect x="150" y="576" width="180" height="50" rx="8" fill="none" stroke="#D55E00" stroke-width="3"/>
  <text x="240" y="606" font-size="15" fill="#111111" text-anchor="middle">8 decide + record</text>
  <text x="240" y="660" font-size="14" fill="#D55E00" text-anchor="middle">decision authority stays human</text>

  <!-- footer note (highlight callout) -->
  <rect x="628" y="640" width="264" height="36" rx="18" fill="#F0E442"/>
  <text x="760" y="664" font-size="16" fill="#111111" text-anchor="middle">observations stay local</text>
</svg>
