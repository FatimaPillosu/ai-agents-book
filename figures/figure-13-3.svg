<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 13.3 — Specification drift, caught against a fixed specification</title>
  <desc>A trace with a fixed specification tag at the top and three agent turns running left to right below it. Each turn's target arrow points progressively further from the specification, shown by a widening dashed gap. A vermillion compare-to-spec gate at the end detects drift and returns to a human decision. A callout marks the point where the target has rotated although every individual step looked responsive.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="ahR" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#D55E00"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- specification (fixed, external) -->
  <rect x="430" y="66" width="420" height="56" rx="8" fill="#0072B2"/>
  <text x="640" y="101" font-size="19" fill="#FFFFFF" text-anchor="middle">specification (fixed, external)</text>

  <!-- widening dashed gap lines from spec to each turn -->
  <line x1="600" y1="122" x2="260" y2="286" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="640" y1="122" x2="490" y2="286" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="700" y1="122" x2="720" y2="286" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- turn 1 -->
  <rect x="185" y="292" width="150" height="82" rx="12" fill="none" stroke="#E69F00" stroke-width="3"/>
  <text x="260" y="340" font-size="17" fill="#111111" text-anchor="middle">turn 1</text>
  <line x1="260" y1="292" x2="260" y2="250" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- turn 2 -->
  <rect x="415" y="292" width="150" height="82" rx="12" fill="none" stroke="#E69F00" stroke-width="3"/>
  <text x="490" y="340" font-size="17" fill="#111111" text-anchor="middle">turn 2</text>
  <line x1="490" y1="292" x2="520" y2="255" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- turn 3 -->
  <rect x="645" y="292" width="150" height="82" rx="12" fill="none" stroke="#E69F00" stroke-width="3"/>
  <text x="720" y="340" font-size="17" fill="#111111" text-anchor="middle">turn 3</text>
  <line x1="720" y1="292" x2="775" y2="268" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- flow arrows between turns -->
  <line x1="335" y1="333" x2="413" y2="333" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="565" y1="333" x2="643" y2="333" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="795" y1="333" x2="843" y2="333" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- compare to spec diamond -->
  <polygon points="920,268 995,333 920,398 845,333" fill="#D55E00"/>
  <text x="920" y="329" font-size="15" fill="#FFFFFF" text-anchor="middle">compare</text>
  <text x="920" y="349" font-size="15" fill="#FFFFFF" text-anchor="middle">to spec</text>

  <!-- drift detected exit to human -->
  <line x1="995" y1="333" x2="1075" y2="333" stroke="#D55E00" stroke-width="2.5" marker-end="url(#ahR)"/>
  <text x="1035" y="316" font-size="15" fill="#D55E00" text-anchor="middle">drift detected</text>

  <!-- human decision -->
  <circle cx="1155" cy="308" r="18" fill="none" stroke="#0072B2" stroke-width="3"/>
  <path d="M1128,378 a27,27 0 0 1 54,0" fill="none" stroke="#0072B2" stroke-width="3"/>
  <text x="1155" y="410" font-size="16" fill="#111111" text-anchor="middle">human decision</text>

  <!-- failure-point callout -->
  <rect x="560" y="150" width="600" height="74" rx="8" fill="#D55E00"/>
  <text x="860" y="182" font-size="17" fill="#FFFFFF" text-anchor="middle">failure point: target has rotated;</text>
  <text x="860" y="206" font-size="17" fill="#FFFFFF" text-anchor="middle">every step looked responsive</text>
  <line x1="820" y1="224" x2="790" y2="300" stroke="#D55E00" stroke-width="2.5" marker-end="url(#ahR)"/>
</svg>
