<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 6.1 — Agents propose, QC rules dispose: where authority sits</title>
  <desc>An architecture diagram. Three raw-input data cylinders feed a QC agent containing a language model, a plan–act–observe loop and three tools. The agent emits justified flag proposals into a deterministic QC-rules diamond overseen by a scientist. The diamond has two exits, apply-flag to a flagged-record store and reject to a rejection log, and both write to a separate provenance store. A callout notes that the agent has no write access to the data.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="ahO" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#E69F00"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- raw input cylinders (sky) -->
  <text x="110" y="170" font-size="16" fill="#111111" text-anchor="middle">raw inputs</text>
  <g fill="#56B4E9" stroke="#111111" stroke-width="1.5">
    <path d="M58,190 v52 a52,12 0 0 0 104,0 v-52"/>
    <ellipse cx="110" cy="190" rx="52" ry="12"/>
    <path d="M58,320 v52 a52,12 0 0 0 104,0 v-52"/>
    <ellipse cx="110" cy="320" rx="52" ry="12"/>
    <path d="M58,450 v52 a52,12 0 0 0 104,0 v-52"/>
    <ellipse cx="110" cy="450" rx="52" ry="12"/>
  </g>
  <g stroke="#111111" stroke-width="2">
    <line x1="162" y1="216" x2="288" y2="290" marker-end="url(#ah)"/>
    <line x1="162" y1="346" x2="288" y2="330" marker-end="url(#ah)"/>
    <line x1="162" y1="476" x2="288" y2="360" marker-end="url(#ah)"/>
  </g>

  <!-- QC agent container -->
  <rect x="290" y="175" width="350" height="390" rx="14" fill="none" stroke="#E69F00" stroke-width="3"/>
  <text x="308" y="207" font-size="20" fill="#E69F00">QC agent</text>

  <!-- LLM box -->
  <rect x="315" y="226" width="120" height="52" rx="8" fill="#E69F00"/>
  <text x="375" y="259" font-size="20" fill="#111111" text-anchor="middle">LLM</text>

  <!-- plan-act-observe loop -->
  <line x1="435" y1="252" x2="510" y2="252" stroke="#111111" stroke-width="1.5"/>
  <path d="M548,214 A38,38 0 1 1 512,252" fill="none" stroke="#E69F00" stroke-width="4" marker-end="url(#ahO)"/>
  <text x="520" y="312" font-size="15" fill="#111111" text-anchor="middle">plan – act – observe</text>

  <!-- three tools (green wrenches) -->
  <g stroke="#009E73" stroke-width="7" fill="none" stroke-linecap="round" transform="translate(350,430)">
    <path d="M9,-9 A14,14 0 1 0 9,9"/>
    <path d="M-10,10 L-24,24"/>
  </g>
  <text x="350" y="480" font-size="13" fill="#111111" text-anchor="middle">format reader</text>

  <g stroke="#009E73" stroke-width="7" fill="none" stroke-linecap="round" transform="translate(470,430)">
    <path d="M9,-9 A14,14 0 1 0 9,9"/>
    <path d="M-10,10 L-24,24"/>
  </g>
  <text x="470" y="480" font-size="13" fill="#111111" text-anchor="middle">unit resolver</text>

  <g stroke="#009E73" stroke-width="7" fill="none" stroke-linecap="round" transform="translate(585,430)">
    <path d="M9,-9 A14,14 0 1 0 9,9"/>
    <path d="M-10,10 L-24,24"/>
  </g>
  <text x="585" y="480" font-size="13" fill="#111111" text-anchor="middle">neighbour query</text>

  <!-- agent to rules diamond -->
  <line x1="640" y1="310" x2="833" y2="310" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="737" y="294" font-size="15" fill="#111111" text-anchor="middle">flag proposals (justified)</text>
  <text x="737" y="336" font-size="14" fill="#111111" text-anchor="middle">proposals only —</text>
  <text x="737" y="356" font-size="14" fill="#111111" text-anchor="middle">no write access to data</text>

  <!-- scientist oversight (blue) -->
  <circle cx="920" cy="90" r="15" fill="none" stroke="#0072B2" stroke-width="3"/>
  <path d="M892,128 a28,28 0 0 1 56,0" fill="none" stroke="#0072B2" stroke-width="3"/>
  <text x="920" y="158" font-size="16" fill="#111111" text-anchor="middle">scientist</text>
  <line x1="920" y1="132" x2="920" y2="223" stroke="#0072B2" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- deterministic QC rules diamond (vermillion) -->
  <polygon points="920,225 1005,310 920,395 835,310" fill="#D55E00"/>
  <text x="920" y="305" font-size="15" fill="#FFFFFF" text-anchor="middle">deterministic</text>
  <text x="920" y="325" font-size="15" fill="#FFFFFF" text-anchor="middle">QC rules</text>
  <text x="920" y="420" font-size="14" fill="#111111" text-anchor="middle">physical bounds · rate limits · inter-station</text>

  <!-- apply flag exit to flagged record -->
  <path d="M1005,310 L1050,310 L1050,210 L1090,210" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="1045" y="300" font-size="14" fill="#111111" text-anchor="middle">apply flag</text>

  <!-- reject exit to rejection log -->
  <path d="M920,395 L920,400 L1090,400" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="1005" y="388" font-size="14" fill="#111111" text-anchor="middle">reject</text>

  <!-- flagged record (sky) -->
  <path d="M1092,186 v48 a58,13 0 0 0 116,0 v-48" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="1150" cy="186" rx="58" ry="13" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="1150" y="216" font-size="15" fill="#111111" text-anchor="middle">flagged record</text>

  <!-- rejection log (grey) -->
  <path d="M1092,376 v48 a58,13 0 0 0 116,0 v-48" fill="#999999" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="1150" cy="376" rx="58" ry="13" fill="#999999" stroke="#111111" stroke-width="1.5"/>
  <text x="1150" y="406" font-size="15" fill="#111111" text-anchor="middle">rejection log</text>

  <!-- provenance store (sky) -->
  <path d="M1092,576 v48 a58,13 0 0 0 116,0 v-48" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="1150" cy="576" rx="58" ry="13" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="1150" y="606" font-size="15" fill="#111111" text-anchor="middle">provenance store</text>

  <!-- provenance dashed spine from both exits -->
  <g stroke="#111111" stroke-width="1.5" stroke-dasharray="6 5" fill="none">
    <path d="M1208,210 L1240,210 L1240,600 L1208,600"/>
    <path d="M1208,400 L1240,400"/>
  </g>
</svg>
