<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 16.2 — The cost model: inference is the smallest share</title>
  <desc>A row of five cost blocks of differing sizes. Model inference is the smallest, marked as falling fast. Engineering is larger. Evaluation and verification are the largest, bracketed as where spend concentrates, with verification marked recurring. A fifth block, failure and rework, is dashed and marked as shrinking when the others are funded. A caption strip notes that magnitudes are illustrative and dated figures live in the repository.</desc>
  <defs>
    <marker id="ahO" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#E69F00"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- vermillion bracket over evaluation + verification -->
  <path d="M422,266 v-14 h456 v14" fill="none" stroke="#D55E00" stroke-width="2"/>
  <text x="650" y="240" font-size="16" fill="#D55E00" text-anchor="middle">where spend concentrates</text>

  <!-- cost blocks (same height, widths suggest relative magnitude) -->
  <rect x="130" y="290" width="90"  height="180" rx="6" fill="#E69F00"/>
  <rect x="246" y="290" width="150" height="180" rx="6" fill="#111111"/>
  <rect x="422" y="290" width="190" height="180" rx="6" fill="#D55E00"/>
  <rect x="638" y="290" width="240" height="180" rx="6" fill="#D55E00"/>
  <rect x="904" y="290" width="130" height="180" rx="6" fill="none" stroke="#999999" stroke-width="2.5" stroke-dasharray="9 6"/>

  <!-- block labels -->
  <text x="175" y="496" font-size="15" fill="#111111" text-anchor="middle">model</text>
  <text x="175" y="514" font-size="15" fill="#111111" text-anchor="middle">inference</text>

  <text x="321" y="496" font-size="15" fill="#111111" text-anchor="middle">engineering</text>

  <text x="517" y="496" font-size="15" fill="#111111" text-anchor="middle">evaluation</text>

  <text x="758" y="496" font-size="15" fill="#111111" text-anchor="middle">verification</text>
  <text x="758" y="514" font-size="15" fill="#111111" text-anchor="middle">(recurring)</text>

  <text x="969" y="496" font-size="15" fill="#111111" text-anchor="middle">failure &amp;</text>
  <text x="969" y="514" font-size="15" fill="#111111" text-anchor="middle">rework</text>

  <!-- falling fast annotation under model inference -->
  <line x1="150" y1="548" x2="200" y2="548" stroke="#E69F00" stroke-width="2.5" marker-end="url(#ahO)"/>
  <text x="175" y="574" font-size="13" fill="#E69F00" text-anchor="middle">falling fast</text>

  <!-- shrinks annotation under failure & rework -->
  <text x="969" y="548" font-size="12" fill="#999999" text-anchor="middle">shrinks as the</text>
  <text x="969" y="564" font-size="12" fill="#999999" text-anchor="middle">others are funded</text>

  <!-- caption strip -->
  <rect x="130" y="636" width="1020" height="38" rx="6" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="640" y="660" font-size="14" fill="#999999" text-anchor="middle">magnitudes illustrative — dated figures in repository</text>
</svg>
