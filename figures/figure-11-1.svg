<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 11.1 — The five-tier evidential hierarchy</title>
  <desc>A vertical ladder of five stacked bars rising from bottom to top. From the base upward the rungs read: execution (runs, output well-formed); internal consistency (invariants hold); reproduces held-out truth (split-sample test); out-of-sample generalisation (differential test); and, at the top in purple with a reviewer icon, independent adversarial scrutiny (a reviewer tries to break it). Each rung carries a small gate symbol marking its check. An upward arrow on the left is labelled increasing evidential strength. A bracket marks the lower two rungs as necessary but not sufficient and the upper three as where correctness is earned.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- increasing evidential strength arrow -->
  <line x1="130" y1="540" x2="130" y2="106" stroke="#111111" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="98" y="325" font-size="16" fill="#111111" text-anchor="middle" transform="rotate(-90 98 325)">increasing evidential strength</text>

  <!-- Tier 1 (bottom): execution -->
  <rect x="180" y="470" width="860" height="70" rx="10" fill="#F7F7F5" stroke="#111111" stroke-width="2"/>
  <text x="215" y="510" font-size="17" fill="#111111"><tspan font-weight="bold">1 · execution</tspan> — runs, output well-formed</text>
  <polygon points="1010,490 1025,505 1010,520 995,505" fill="#D55E00"/>

  <!-- Tier 2: internal consistency -->
  <rect x="180" y="380" width="860" height="70" rx="10" fill="#F7F7F5" stroke="#111111" stroke-width="2"/>
  <text x="215" y="420" font-size="17" fill="#111111"><tspan font-weight="bold">2 · internal consistency</tspan> — invariants hold</text>
  <polygon points="1010,400 1025,415 1010,430 995,415" fill="#D55E00"/>

  <!-- Tier 3: reproduces held-out truth -->
  <rect x="180" y="290" width="860" height="70" rx="10" fill="#F7F7F5" stroke="#111111" stroke-width="2"/>
  <text x="215" y="330" font-size="17" fill="#111111"><tspan font-weight="bold">3 · reproduces held-out truth</tspan> — split-sample test</text>
  <polygon points="1010,310 1025,325 1010,340 995,325" fill="#D55E00"/>

  <!-- Tier 4: out-of-sample generalisation -->
  <rect x="180" y="200" width="860" height="70" rx="10" fill="#F7F7F5" stroke="#111111" stroke-width="2"/>
  <text x="215" y="240" font-size="17" fill="#111111"><tspan font-weight="bold">4 · out-of-sample generalisation</tspan> — differential test</text>
  <polygon points="1010,220 1025,235 1010,250 995,235" fill="#D55E00"/>

  <!-- Tier 5 (top): independent adversarial scrutiny -->
  <rect x="180" y="110" width="860" height="70" rx="10" fill="#F7F7F5" stroke="#CC79A7" stroke-width="3"/>
  <!-- reviewer icon: head + shoulders + tick -->
  <circle cx="225" cy="132" r="9" fill="none" stroke="#CC79A7" stroke-width="2.5"/>
  <path d="M209,153 a16,16 0 0 1 32,0" fill="none" stroke="#CC79A7" stroke-width="2.5"/>
  <path d="M234,140 l5,6 l10,-12" fill="none" stroke="#CC79A7" stroke-width="2.5"/>
  <text x="262" y="150" font-size="17" fill="#111111"><tspan font-weight="bold">5 · independent adversarial scrutiny</tspan> — reviewer tries to break it</text>
  <polygon points="1010,130 1025,145 1010,160 995,145" fill="#D55E00"/>

  <!-- bracket: tiers 1-2 necessary, not sufficient -->
  <path d="M1070,384 L1085,384 L1085,536 L1070,536" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="1112" y="460" font-size="15" fill="#111111" text-anchor="middle" transform="rotate(-90 1112 460)">necessary, not sufficient</text>

  <!-- bracket: tiers 3-5 correctness earned here -->
  <path d="M1070,114 L1085,114 L1085,356 L1070,356" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="1112" y="235" font-size="15" fill="#111111" text-anchor="middle" transform="rotate(-90 1112 235)">correctness earned here</text>

  <!-- faint note -->
  <text x="610" y="585" font-size="14" fill="#999999" text-anchor="middle">each tier subsumes those below</text>
</svg>
