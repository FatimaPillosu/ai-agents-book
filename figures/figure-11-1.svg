<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><marker id="ah111" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs>
<rect width="1600" height="900" fill="#F7F7F5"/>
<text x="56.0" y="72.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" fill="#111111" font-weight="600" text-anchor="start">Six tiers of evidence for a workflow claim</text>
<text x="56.0" y="112.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#3A3A3A" font-weight="400" text-anchor="start">A claim holds the highest tier it actually passed - not the one you hoped for.</text>
<rect x="200.0" y="676.0" width="620.0" height="72.0" rx="8" fill="none" stroke="#111111" stroke-width="2"/>
<text x="228.0" y="718.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="start">1 · execution - runs, output well-formed</text>
<polygon points="820,692.0 847.0,712 820,732.0 793.0,712" fill="none" stroke="#D55E00" stroke-width="2.4"/>
<rect x="200.0" y="580.0" width="620.0" height="72.0" rx="8" fill="none" stroke="#111111" stroke-width="2"/>
<text x="228.0" y="622.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="start">2 · internal consistency - invariants hold</text>
<polygon points="820,596.0 847.0,616 820,636.0 793.0,616" fill="none" stroke="#D55E00" stroke-width="2.4"/>
<rect x="200.0" y="484.0" width="620.0" height="72.0" rx="8" fill="none" stroke="#111111" stroke-width="2"/>
<text x="228.0" y="526.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="start">3 · reproduces held-out truth - split-sample test</text>
<polygon points="820,500.0 847.0,520 820,540.0 793.0,520" fill="none" stroke="#D55E00" stroke-width="2.4"/>
<text x="880.0" y="506.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">the first tier where the word</text>
<text x="880.0" y="524.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">correct is earned</text>
<rect x="200.0" y="388.0" width="620.0" height="72.0" rx="8" fill="none" stroke="#111111" stroke-width="2"/>
<text x="228.0" y="430.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="start">4 · out-of-sample generalisation - differential test</text>
<polygon points="820,404.0 847.0,424 820,444.0 793.0,424" fill="none" stroke="#D55E00" stroke-width="2.4"/>
<rect x="200.0" y="292.0" width="620.0" height="72.0" rx="8" fill="none" stroke="#111111" stroke-width="2"/>
<text x="326.0" y="322.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="start">5 · independent-method corroboration - a second</text>
<text x="326.0" y="346.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="start">method with a different error structure agrees</text>
<polygon points="820,308.0 847.0,328 820,348.0 793.0,328" fill="none" stroke="#D55E00" stroke-width="2.4"/>
<text x="880.0" y="314.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">changes the measurement chain,</text>
<text x="880.0" y="332.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">not just the regime</text>
<rect x="200.0" y="196.0" width="620.0" height="72.0" rx="8" fill="none" stroke="#CC79A7" stroke-width="2.6"/>
<text x="300.0" y="226.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="start">6 · adversarial scrutiny - a competent party tries</text>
<text x="300.0" y="250.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="start">to break it and fails</text>
<polygon points="820,212.0 847.0,232 820,252.0 793.0,232" fill="none" stroke="#D55E00" stroke-width="2.4"/>
<text x="880.0" y="218.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">cannot be automated -</text>
<text x="880.0" y="236.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">judgement does the certifying</text>
<path d="M219.5,338.5 l14.25,-14.25 M234.5,323.5 a6.0,6.0 0 1 0 7.5,7.5" fill="none" stroke="#009E73" stroke-width="2.5" stroke-linecap="round"/>
<path d="M256,312.16 a28.0,6.16 0 0 1 56,0 v31.68 a28.0,6.16 0 0 1 -56,0 z" fill="none" stroke="#56B4E9" stroke-width="2.2"/>
<path d="M256,312.16 a28.0,6.16 0 0 0 56,0" fill="none" stroke="#56B4E9" stroke-width="2.2"/>
<circle cx="250" cy="218.4" r="9.6" fill="none" stroke="#CC79A7" stroke-width="2.3"/>
<path d="M234,243.2 a16,14.4 0 0 1 32,0" fill="none" stroke="#CC79A7" stroke-width="2.3"/>
<path d="M259.6,230.4 l5.12,5.76 l10.56,-12.8" fill="none" stroke="#CC79A7" stroke-width="2.5" stroke-linecap="round"/>
<rect x="1150.0" y="186.0" width="300.0" height="76.3" rx="8" fill="#F0E442" stroke="none"/>
<text x="1162.0" y="210.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="400" text-anchor="start">the only tier named for the checker,</text>
<text x="1162.0" y="229.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="400" text-anchor="start">not the check - its strength is a</text>
<text x="1162.0" y="248.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="400" text-anchor="start">measured quantity (§11.5)</text>
<line x1="160.0" y1="750.0" x2="160.0" y2="190.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah111)"/>
<text x="56.0" y="440.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">increasing</text>
<text x="56.0" y="458.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">evidential</text>
<text x="56.0" y="477.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">strength</text>
<path d="M1470,580 h16 v168 h-16 M1470,196 h16 v360 h-16" fill="none" stroke="#999999" stroke-width="1.6"/>
<text x="1450.0" y="664.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="end">necessary - and almost worthless alone</text>
<text x="1450.0" y="376.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="end">correctness earned here</text>
<text x="56.0" y="860.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#999999" font-weight="400" text-anchor="start">The tiers are cumulative: a tier-5 claim has passed 1 to 5.</text>
</svg>
