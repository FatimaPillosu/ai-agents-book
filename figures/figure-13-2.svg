<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<defs><marker id="ah132" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker></defs>
<rect width="1600" height="900" fill="#F7F7F5"/>
<text x="56.0" y="72.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" fill="#111111" font-weight="600" text-anchor="start">A silent unit error, made loud by a range assertion</text>
<text x="56.0" y="112.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#3A3A3A" font-weight="400" text-anchor="start">Nothing about the number looks wrong. That is the problem.</text>
<rect x="282.0" y="232.0" width="36.0" height="36.0" rx="6" fill="none" stroke="#E69F00" stroke-width="2.3"/>
<path d="M292.8,251.8 a7.56,7.56 0 1 1 8.64,6.12" fill="none" stroke="#E69F00" stroke-width="2"/>
<text x="300.0" y="306.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#111111" font-weight="400" text-anchor="middle">agent computes quantity</text>
<rect x="180.0" y="360.0" width="240.0" height="72.0" rx="10" fill="none" stroke="#56B4E9" stroke-width="2.2"/>
<text x="300.0" y="390.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">number: 42 (no</text>
<text x="300.0" y="414.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">units)</text>
<line x1="300.0" y1="318.0" x2="300.0" y2="354.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah132)"/>
<rect x="460.0" y="367.4" width="3.4" height="56.3" fill="#D55E00"/>
<text x="472.0" y="380.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#D55E00" font-weight="400" text-anchor="start">wrong by a physical factor - and</text>
<text x="472.0" y="398.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#D55E00" font-weight="400" text-anchor="start">still a perfectly</text>
<text x="472.0" y="417.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#D55E00" font-weight="400" text-anchor="start">reasonable-looking value</text>
<polygon points="300,492.0 450.0,540 300,588.0 150.0,540" fill="none" stroke="#D55E00" stroke-width="2.4"/>
<text x="300.0" y="534.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">units + range</text>
<text x="300.0" y="558.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">assertion</text>
<line x1="300.0" y1="432.0" x2="300.0" y2="488.0" stroke="#111111" stroke-width="2.1" marker-end="url(#ah132)"/>
<text x="480.0" y="530.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">does not reason about the science:</text>
<text x="480.0" y="548.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">refuses unlabelled units and</text>
<text x="480.0" y="567.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">impossible values</text>
<path d="M150.0,540.0 L90.0,540.0 L90.0,250.0 L266.0,250.0" fill="none" stroke="#111111" stroke-width="2.1" marker-end="url(#ah132)"/>
<text x="100.0" y="340.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#D55E00" font-weight="400" text-anchor="start">out of range - halt</text>
<rect x="180.0" y="660.0" width="240.0" height="66.0" rx="10" fill="none" stroke="#999999" stroke-width="2.2"/>
<text x="300.0" y="699.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#111111" font-weight="400" text-anchor="middle">downstream use</text>
<line x1="300.0" y1="592.0" x2="300.0" y2="654.0" stroke="#999999" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="168" y1="693" x2="432" y2="693" stroke="#D55E00" stroke-width="5"/>
<text x="470.0" y="698.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#3A3A3A" font-weight="400" text-anchor="start">error stopped here - the calibration and the verification never see it</text>
<text x="56.0" y="860.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#999999" font-weight="400" text-anchor="start">The whole trick is turning a silent failure into a loud one: loud gets caught, silent gets shipped.</text>
</svg>
