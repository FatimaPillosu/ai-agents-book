<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 13.2 — A silent unit error, made loud by a range assertion</title>
  <desc>A top-to-bottom trace. An agent computes a quantity, emitting a bare number with no units. The number reaches a vermillion gate that asserts units and a physical range; an out-of-range exit halts the flow and returns to the agent. A downstream-use box below is shown crossed out in vermillion, unreached. A callout marks the bare number as wrong by a physical factor yet reasonable-looking.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="ahR" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#D55E00"/>
    </marker>
    <marker id="ahG" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#999999"/>
    </marker>
    <marker id="ahO" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#E69F00"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- agent computes quantity -->
  <rect x="310" y="90" width="240" height="85" rx="12" fill="none" stroke="#E69F00" stroke-width="3"/>
  <path d="M520,104 a11,11 0 1 1 -7,-4" fill="none" stroke="#E69F00" stroke-width="2.5" marker-end="url(#ahO)"/>
  <text x="430" y="127" font-size="16" fill="#111111" text-anchor="middle">agent computes</text>
  <text x="430" y="149" font-size="16" fill="#111111" text-anchor="middle">quantity</text>
  <line x1="430" y1="175" x2="430" y2="217" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- number (no units) card -->
  <rect x="310" y="220" width="240" height="82" rx="8" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="430" y="252" font-size="16" fill="#111111" text-anchor="middle">number (no units)</text>
  <text x="430" y="286" font-size="22" fill="#111111" text-anchor="middle" font-weight="bold">42</text>
  <line x1="430" y1="302" x2="430" y2="345" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- units + range assertion diamond -->
  <polygon points="430,347 522,415 430,483 338,415" fill="#D55E00"/>
  <text x="430" y="410" font-size="15" fill="#FFFFFF" text-anchor="middle">units + range</text>
  <text x="430" y="430" font-size="15" fill="#FFFFFF" text-anchor="middle">assertion</text>

  <!-- out of range halt exit (left routing) -->
  <path d="M338,415 L240,415 L240,132 L308,132" fill="none" stroke="#D55E00" stroke-width="2.5" marker-end="url(#ahR)"/>
  <text x="150" y="210" font-size="15" fill="#D55E00" text-anchor="start">out of range — halt</text>

  <!-- blocked path to downstream -->
  <line x1="430" y1="483" x2="430" y2="548" stroke="#999999" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ahG)"/>

  <!-- downstream use (unreached) -->
  <rect x="310" y="562" width="240" height="82" rx="8" fill="none" stroke="#999999" stroke-width="2.5"/>
  <text x="430" y="610" font-size="16" fill="#999999" text-anchor="middle">downstream use</text>
  <!-- vermillion bar across it -->
  <rect x="300" y="551" width="260" height="13" fill="#D55E00"/>
  <text x="590" y="608" font-size="16" fill="#D55E00" text-anchor="start">error stopped before it propagates</text>

  <!-- failure-point callout -->
  <rect x="610" y="222" width="580" height="74" rx="8" fill="#D55E00"/>
  <text x="900" y="254" font-size="17" fill="#FFFFFF" text-anchor="middle">failure point: wrong by a physical</text>
  <text x="900" y="278" font-size="17" fill="#FFFFFF" text-anchor="middle">factor, looks reasonable</text>
  <line x1="608" y1="261" x2="552" y2="261" stroke="#D55E00" stroke-width="2.5" marker-end="url(#ahR)"/>
</svg>
