<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 10.1 — When a second agent adds information and when it adds only cost</title>
  <desc>A top-to-bottom decision flowchart. A proposed second agent first meets the question of whether it names an error class the existing roster misses; if no, it is dropped in favour of a deterministic gate. If yes, a second question asks whether its judgement is independent of the checked agent, annotated with four levers: different model, narrowed context, adversarial brief, external source of truth. Only if that also holds is the agent kept as an independent reviewer.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- start (grey) -->
  <rect x="320" y="50" width="280" height="58" rx="12" fill="none" stroke="#999999" stroke-width="3"/>
  <text x="460" y="86" font-size="17" fill="#111111" text-anchor="middle">proposed second agent</text>

  <!-- gate 1 -->
  <line x1="460" y1="108" x2="460" y2="158" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <polygon points="460,160 590,230 460,300 330,230" fill="#D55E00"/>
  <text x="460" y="224" font-size="15" fill="#FFFFFF" text-anchor="middle">names an error class</text>
  <text x="460" y="244" font-size="15" fill="#FFFFFF" text-anchor="middle">the roster misses?</text>

  <!-- drop terminal (grey) -->
  <rect x="800" y="278" width="340" height="86" rx="12" fill="none" stroke="#999999" stroke-width="3"/>
  <polygon points="852,308 878,326 852,344 826,326" fill="none" stroke="#999999" stroke-width="2.5"/>
  <text x="985" y="320" font-size="16" fill="#111111" text-anchor="middle">drop — add a</text>
  <text x="985" y="342" font-size="16" fill="#111111" text-anchor="middle">deterministic gate instead</text>

  <!-- gate1 no -> drop -->
  <path d="M590,230 L700,230 L700,300 L798,315" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="640" y="218" font-size="15" fill="#111111" text-anchor="middle">no</text>

  <!-- gate1 yes -> gate 2 -->
  <line x1="460" y1="300" x2="460" y2="352" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="477" y="332" font-size="15" fill="#111111" text-anchor="start">yes</text>

  <!-- gate 2 -->
  <polygon points="460,354 600,432 460,510 320,432" fill="#D55E00"/>
  <text x="460" y="426" font-size="15" fill="#FFFFFF" text-anchor="middle">judgement independent</text>
  <text x="460" y="446" font-size="15" fill="#FFFFFF" text-anchor="middle">of the checked agent?</text>

  <!-- levers callout (yellow highlight fill) -->
  <rect x="40" y="366" width="250" height="132" rx="8" fill="#F0E442"/>
  <text x="60" y="392" font-size="15" fill="#111111" text-anchor="start">independence levers:</text>
  <text x="60" y="418" font-size="14" fill="#111111" text-anchor="start">· different model</text>
  <text x="60" y="440" font-size="14" fill="#111111" text-anchor="start">· narrowed context</text>
  <text x="60" y="462" font-size="14" fill="#111111" text-anchor="start">· adversarial brief</text>
  <text x="60" y="484" font-size="14" fill="#111111" text-anchor="start">· external source of truth</text>
  <line x1="290" y1="432" x2="318" y2="432" stroke="#111111" stroke-width="1.5"/>

  <!-- gate2 no -> drop -->
  <path d="M600,432 L700,432 L700,364" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="650" y="420" font-size="15" fill="#111111" text-anchor="middle">no</text>

  <!-- gate2 yes -> keep -->
  <line x1="460" y1="510" x2="460" y2="560" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>
  <text x="477" y="540" font-size="15" fill="#111111" text-anchor="start">yes</text>

  <!-- keep terminal (reviewer purple) -->
  <rect x="290" y="562" width="340" height="86" rx="12" fill="none" stroke="#CC79A7" stroke-width="3"/>
  <circle cx="352" cy="596" r="13" fill="none" stroke="#CC79A7" stroke-width="3"/>
  <path d="M330,632 a22,22 0 0 1 44,0" fill="none" stroke="#CC79A7" stroke-width="3"/>
  <path d="M384,600 l7,7 l14,-16" fill="none" stroke="#CC79A7" stroke-width="3"/>
  <text x="500" y="600" font-size="16" fill="#111111" text-anchor="middle">keep —</text>
  <text x="500" y="622" font-size="16" fill="#111111" text-anchor="middle">independent reviewer</text>
</svg>
