<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 6.3 — Manual scripts-and-eyes QC versus governed propose–dispose</title>
  <desc>A two-row before-and-after diagram. The top row shows a human cycling between per-format loaders, hand-tuned checks and a plot-and-eyeball step, with a faded note that reasoning is lost in comments. The bottom row shows raw inputs feeding a QC agent that proposes into a deterministic-rules diamond, then a flagged record and a provenance store. A bracket links the checks in both rows, labelled same checks, same authority, retained.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- row labels -->
  <text x="45" y="110" font-size="18" font-weight="bold" fill="#111111">conventional</text>
  <text x="45" y="410" font-size="18" font-weight="bold" fill="#111111">agentic redesign</text>

  <!-- ============ TOP ROW ============ -->
  <!-- human icon (blue) -->
  <circle cx="150" cy="195" r="15" fill="none" stroke="#0072B2" stroke-width="3"/>
  <path d="M122,233 a28,28 0 0 1 56,0" fill="none" stroke="#0072B2" stroke-width="3"/>

  <!-- per-format loaders (green tool box) -->
  <rect x="320" y="153" width="140" height="54" rx="8" fill="#F7F7F5" stroke="#009E73" stroke-width="3"/>
  <text x="390" y="185" font-size="14" fill="#111111" text-anchor="middle">per-format loaders</text>

  <!-- hand-tuned checks (green diamond) -->
  <polygon points="620,152 668,200 620,248 572,200" fill="none" stroke="#009E73" stroke-width="3"/>
  <text x="620" y="278" font-size="14" fill="#111111" text-anchor="middle">hand-tuned checks</text>

  <!-- plot and eyeball (sky box) -->
  <rect x="785" y="153" width="150" height="54" rx="8" fill="#56B4E9"/>
  <text x="860" y="185" font-size="14" fill="#111111" text-anchor="middle">plot and eyeball</text>

  <!-- faded note -->
  <text x="440" y="285" font-size="14" fill="#999999" text-anchor="middle">reasoning lost in comments</text>

  <!-- cycle arrows -->
  <g stroke="#111111" stroke-width="2" fill="none">
    <line x1="170" y1="192" x2="316" y2="180" marker-end="url(#ah)"/>
    <line x1="462" y1="185" x2="570" y2="198" marker-end="url(#ah)"/>
    <line x1="670" y1="192" x2="783" y2="182" marker-end="url(#ah)"/>
    <path d="M855,210 C740,315 330,320 172,222" marker-end="url(#ah)"/>
  </g>

  <!-- ============ BOTTOM ROW ============ -->
  <!-- raw inputs cylinder (sky) -->
  <path d="M102,470 v56 a48,12 0 0 0 96,0 v-56" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="150" cy="470" rx="48" ry="12" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="150" y="562" font-size="14" fill="#111111" text-anchor="middle">raw inputs</text>

  <!-- QC agent (orange box) -->
  <rect x="285" y="455" width="150" height="90" rx="12" fill="none" stroke="#E69F00" stroke-width="3"/>
  <text x="360" y="505" font-size="16" fill="#E69F00" text-anchor="middle">QC agent</text>

  <!-- deterministic rules (vermillion diamond) -->
  <polygon points="620,452 668,500 620,548 572,500" fill="#D55E00"/>
  <text x="620" y="578" font-size="14" fill="#111111" text-anchor="middle">deterministic rules</text>

  <!-- flagged record cylinder (sky) -->
  <path d="M812,470 v56 a48,12 0 0 0 96,0 v-56" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="860" cy="470" rx="48" ry="12" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="860" y="562" font-size="14" fill="#111111" text-anchor="middle">flagged record</text>

  <!-- provenance store cylinder (sky) -->
  <path d="M1012,470 v56 a48,12 0 0 0 96,0 v-56" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <ellipse cx="1060" cy="470" rx="48" ry="12" fill="#56B4E9" stroke="#111111" stroke-width="1.5"/>
  <text x="1060" y="562" font-size="14" fill="#111111" text-anchor="middle">provenance store</text>

  <!-- bottom-row arrows -->
  <g stroke="#111111" stroke-width="2">
    <line x1="198" y1="500" x2="283" y2="500" marker-end="url(#ah)"/>
    <line x1="435" y1="500" x2="570" y2="500" marker-end="url(#ah)"/>
    <line x1="668" y1="500" x2="810" y2="500" marker-end="url(#ah)"/>
    <line x1="908" y1="500" x2="1010" y2="500" marker-end="url(#ah)"/>
  </g>
  <text x="503" y="485" font-size="14" fill="#111111" text-anchor="middle">propose</text>

  <!-- bracket linking the checks in both rows -->
  <path d="M620,250 L700,250 L700,450 L620,450" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="715" y="345" font-size="14" fill="#111111">same checks, same authority —</text>
  <text x="715" y="365" font-size="14" fill="#111111">retained</text>
</svg>
