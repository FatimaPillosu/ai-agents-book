<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 13.4 — Sycophantic review, exposed by engineered independence</title>
  <desc>Two stacked left-to-right traces over one artefact. In the top trace a reviewer that sees the author's conclusion returns an approval, marked in vermillion as false assurance with no evidential lift. In the bottom trace the same artefact with the conclusion withheld goes to an independent reviewer framed to find defects, which returns a genuine defect. A callout marks the top reviewer as agreeing with the position it inferred.</desc>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#111111"/>
    </marker>
    <marker id="ahR" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 Z" fill="#D55E00"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#F7F7F5"/>

  <!-- ============ TOP TRACE: failure ============ -->
  <!-- artefact + author conclusion -->
  <rect x="70" y="235" width="230" height="86" rx="8" fill="#0072B2"/>
  <text x="185" y="272" font-size="16" fill="#FFFFFF" text-anchor="middle">artefact + author</text>
  <text x="185" y="294" font-size="16" fill="#FFFFFF" text-anchor="middle">conclusion</text>
  <line x1="300" y1="278" x2="378" y2="278" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- reviewer sees conclusion -->
  <rect x="382" y="235" width="230" height="86" rx="12" fill="none" stroke="#CC79A7" stroke-width="3"/>
  <circle cx="418" cy="262" r="11" fill="none" stroke="#CC79A7" stroke-width="2.5"/>
  <path d="M401,292 a17,17 0 0 1 34,0" fill="none" stroke="#CC79A7" stroke-width="2.5"/>
  <text x="512" y="272" font-size="16" fill="#111111" text-anchor="middle">reviewer sees</text>
  <text x="512" y="294" font-size="16" fill="#111111" text-anchor="middle">conclusion</text>
  <line x1="612" y1="278" x2="690" y2="278" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- approved (crossed) -->
  <rect x="694" y="235" width="200" height="86" rx="8" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="794" y="270" font-size="17" fill="#111111" text-anchor="middle">approved</text>
  <path d="M760,290 l14,14 l26,-30" fill="none" stroke="#111111" stroke-width="3"/>
  <!-- vermillion X across it -->
  <line x1="710" y1="245" x2="878" y2="311" stroke="#D55E00" stroke-width="4"/>
  <line x1="878" y1="245" x2="710" y2="311" stroke="#D55E00" stroke-width="4"/>
  <!-- false assurance tag -->
  <rect x="694" y="335" width="270" height="34" rx="6" fill="#D55E00"/>
  <text x="829" y="357" font-size="14" fill="#FFFFFF" text-anchor="middle">false assurance — no evidential lift</text>

  <!-- failure-point callout -->
  <rect x="560" y="70" width="620" height="74" rx="8" fill="#D55E00"/>
  <text x="870" y="102" font-size="17" fill="#FFFFFF" text-anchor="middle">failure point: reviewer agrees with the</text>
  <text x="870" y="126" font-size="17" fill="#FFFFFF" text-anchor="middle">position it inferred</text>
  <line x1="700" y1="144" x2="540" y2="232" stroke="#D55E00" stroke-width="2.5" marker-end="url(#ahR)"/>

  <!-- divider -->
  <line x1="70" y1="420" x2="960" y2="420" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 7"/>

  <!-- ============ BOTTOM TRACE: fix ============ -->
  <!-- artefact, conclusion withheld -->
  <rect x="70" y="500" width="230" height="86" rx="8" fill="#0072B2"/>
  <text x="185" y="537" font-size="16" fill="#FFFFFF" text-anchor="middle">artefact, conclusion</text>
  <text x="185" y="559" font-size="16" fill="#FFFFFF" text-anchor="middle">withheld</text>
  <line x1="300" y1="543" x2="378" y2="543" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- reviewer: find defects -->
  <rect x="382" y="500" width="230" height="86" rx="12" fill="none" stroke="#CC79A7" stroke-width="3"/>
  <circle cx="418" cy="527" r="11" fill="none" stroke="#CC79A7" stroke-width="2.5"/>
  <path d="M401,557 a17,17 0 0 1 34,0" fill="none" stroke="#CC79A7" stroke-width="2.5"/>
  <text x="512" y="537" font-size="16" fill="#111111" text-anchor="middle">reviewer:</text>
  <text x="512" y="559" font-size="16" fill="#111111" text-anchor="middle">find defects</text>
  <line x1="612" y1="543" x2="690" y2="543" stroke="#111111" stroke-width="2" marker-end="url(#ah)"/>

  <!-- defect found -->
  <rect x="694" y="500" width="200" height="86" rx="8" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="805" y="550" font-size="17" fill="#111111" text-anchor="middle">defect found</text>
  <path d="M714,542 l12,12 l22,-26" fill="none" stroke="#009E73" stroke-width="3.5"/>
</svg>
